# Evolution API (o serviço ligado ao WhatsApp), instalada uma vez e que fica no ar para sempre:
# `restart: always` religa sozinha depois de queda de energia ou reinício, e os dados (a conexão do WhatsApp
# e o banco da própria Evolution) ficam em volumes. Não use `docker compose down -v`: ele apaga os volumes.
# Instalação e uso: veja LEIA-ME.md (instalar.bat no Windows, instalar.sh no Linux e Mac).

name: evolution

services:
  db:
    image: postgres:15-alpine
    container_name: evolution_db
    restart: always
    environment:
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: "${EVOLUTION_DB_SENHA:?Rode o instalador, que cria o arquivo .env}"
      POSTGRES_DB: evolution_db
    volumes:
      - evolution_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U evolution -d evolution_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    image: evoapicloud/evolution-api:v2.3.7
    container_name: evolution_api
    restart: always
    # Só este computador alcança a API por padrão (127.0.0.1). Para outros computadores da escola,
    # troque EVOLUTION_BIND para 0.0.0.0 no .env.
    ports:
      - "${EVOLUTION_BIND:-127.0.0.1}:${EVOLUTION_PORTA:-8081}:8080"
    environment:
      - SERVER_URL=http://localhost:${EVOLUTION_PORTA:-8081}
      - AUTHENTICATION_TYPE=apikey
      - "AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY:?Rode o instalador, que cria o arquivo .env}"
      - DATABASE_ENABLED=true
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_SENHA}@db:5432/evolution_db?schema=public
      - DATABASE_CONNECTION_CLIENT_NAME=evolution
      - DATABASE_SAVE_DATA_INSTANCE=true
      - CACHE_REDIS_ENABLED=false
      - CACHE_LOCAL_ENABLED=true
      - CONFIG_SESSION_PHONE_CLIENT=Chrome
      - CONFIG_SESSION_PHONE_NAME=Chrome
      - QRCODE_LIMIT=30
      - LANGUAGE=pt-BR
      # O portal chama a API pelo navegador: precisa aceitar a origem dele (a chave é que protege).
      - CORS_ORIGIN=*
      - CORS_METHODS=GET,POST,PUT,DELETE
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - evolution_instances:/evolution/instances

volumes:
  evolution_pg:
  evolution_instances:
