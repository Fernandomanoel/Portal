  <rect width="640" height="400" fill="#ffffff"/>
  <defs><marker id="ponta" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#1f2937"/></marker></defs>
