<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Cada lugar pede um tom</text>
  <rect x="26" y="48" width="588" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="44" y="74" font-size="11" fill="#6b7280" font-weight="700">Ambiente</text>
  <text x="214" y="74" font-size="11" fill="#6b7280" font-weight="700">Tom esperado</text>
  <text x="364" y="74" font-size="11" fill="#6b7280" font-weight="700">Cuidado principal</text>
  <rect x="38" y="88" width="564" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="117" font-size="12" fill="#1f2937" font-weight="700">Trabalho</text>
  <text x="214" y="117" font-size="11" fill="#1f2937">cordial e objetivo</text>
  <text x="364" y="117" font-size="10" fill="#6b7280">críticas a sós; fatos, não pessoas</text>
  <rect x="38" y="144" width="564" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="173" font-size="12" fill="#1f2937" font-weight="700">Sala de aula</text>
  <text x="214" y="173" font-size="11" fill="#1f2937">respeitoso</text>
  <text x="364" y="173" font-size="10" fill="#6b7280">dúvida é bem-vinda; ninguém é exposto</text>
  <rect x="38" y="200" width="564" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="229" font-size="12" fill="#1f2937" font-weight="700">Família</text>
  <text x="214" y="229" font-size="11" fill="#1f2937">afetivo e franco</text>
  <text x="364" y="229" font-size="10" fill="#6b7280">velhas mágoas voltam: escolha o momento</text>
  <rect x="38" y="256" width="564" height="48" rx="8" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="285" font-size="12" fill="#1f2937" font-weight="700">Atendimento ao público</text>
  <text x="214" y="285" font-size="11" fill="#1f2937">calmo e acolhedor</text>
  <text x="364" y="285" font-size="10" fill="#6b7280">o cliente irritado não é inimigo</text>
  <rect x="38" y="312" width="564" height="48" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="50" y="341" font-size="12" fill="#1f2937" font-weight="700">Redes sociais</text>
  <text x="214" y="341" font-size="11" fill="#1f2937">como se fosse ao vivo</text>
  <text x="364" y="341" font-size="10" fill="#6b7280">o texto não tem tom: releia antes</text>
</svg>
