<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Seis emoções básicas e para que cada uma serve</text>
  <rect x="26" y="52" width="188" height="148" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="74" cy="126" r="32" fill="#fde68a" stroke="#1f2937" stroke-width="2"/>
  <circle cx="62.8" cy="120.24" r="2.88" fill="#1f2937"/>
  <circle cx="85.2" cy="120.24" r="2.88" fill="#1f2937"/>
  <path d="M60.56 133.2 Q74 149.2 87.44 133.2" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="108" font-size="14" fill="#1f2937" font-weight="700">Alegria</text>
  <text x="118" y="134" font-size="10.5" fill="#6b7280">aproxima e</text>
  <text x="118" y="150" font-size="10.5" fill="#6b7280">reforça o bom</text>
  <rect x="226" y="52" width="188" height="148" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="274" cy="126" r="32" fill="#bfdbfe" stroke="#1f2937" stroke-width="2"/>
  <circle cx="262.8" cy="120.24" r="2.88" fill="#1f2937"/>
  <circle cx="285.2" cy="120.24" r="2.88" fill="#1f2937"/>
  <path d="M260.56 143.2 Q274 129.2 287.44 143.2" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <text x="318" y="108" font-size="14" fill="#1f2937" font-weight="700">Tristeza</text>
  <text x="318" y="134" font-size="10.5" fill="#6b7280">pede pausa,</text>
  <text x="318" y="150" font-size="10.5" fill="#6b7280">cuidado e apoio</text>
  <rect x="426" y="52" width="188" height="148" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="474" cy="126" r="32" fill="#fecaca" stroke="#1f2937" stroke-width="2"/>
  <circle cx="462.8" cy="120.24" r="2.88" fill="#1f2937"/>
  <circle cx="485.2" cy="120.24" r="2.88" fill="#1f2937"/>
  <path d="M460.56 140.2 H487.44" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <path d="M456.4 110 L469.2 115.76 M491.6 110 L478.8 115.76" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <text x="518" y="108" font-size="14" fill="#1f2937" font-weight="700">Raiva</text>
  <text x="518" y="134" font-size="10.5" fill="#6b7280">avisa que algo</text>
  <text x="518" y="150" font-size="10.5" fill="#6b7280">foi injusto</text>
  <rect x="26" y="212" width="188" height="148" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="74" cy="286" r="32" fill="#ddd6fe" stroke="#1f2937" stroke-width="2"/>
  <circle cx="62.8" cy="280.24" r="2.88" fill="#1f2937"/>
  <circle cx="85.2" cy="280.24" r="2.88" fill="#1f2937"/>
  <ellipse cx="74" cy="299.2" rx="5.76" ry="7.04" fill="#1f2937"/>
  <path d="M56.4 273.2 Q62.8 266.8 69.2 271.6 M91.6 273.2 Q85.2 266.8 78.8 271.6" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <text x="118" y="268" font-size="14" fill="#1f2937" font-weight="700">Medo</text>
  <text x="118" y="294" font-size="10.5" fill="#6b7280">protege de</text>
  <text x="118" y="310" font-size="10.5" fill="#6b7280">um perigo</text>
  <rect x="226" y="212" width="188" height="148" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="274" cy="286" r="32" fill="#bbf7d0" stroke="#1f2937" stroke-width="2"/>
  <circle cx="262.8" cy="280.24" r="2.88" fill="#1f2937"/>
  <circle cx="285.2" cy="280.24" r="2.88" fill="#1f2937"/>
  <path d="M260.56 299.2 Q267.28 291.2 274 299.2 Q280.72 305.2 287.44 297.2" fill="none" stroke="#1f2937" stroke-width="2.4" stroke-linecap="round"/>
  <text x="318" y="268" font-size="14" fill="#1f2937" font-weight="700">Nojo</text>
  <text x="318" y="294" font-size="10.5" fill="#6b7280">afasta do que</text>
  <text x="318" y="310" font-size="10.5" fill="#6b7280">faz mal</text>
  <rect x="426" y="212" width="188" height="148" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="474" cy="286" r="32" fill="#fed7aa" stroke="#1f2937" stroke-width="2"/>
  <circle cx="462.8" cy="280.24" r="2.88" fill="#1f2937"/>
  <circle cx="485.2" cy="280.24" r="2.88" fill="#1f2937"/>
  <circle cx="474" cy="299.2" r="6.4" fill="#1f2937"/>
  <text x="518" y="268" font-size="14" fill="#1f2937" font-weight="700">Surpresa</text>
  <text x="518" y="294" font-size="10.5" fill="#6b7280">chama a atenção</text>
  <text x="518" y="310" font-size="10.5" fill="#6b7280">para o novo</text>
  <text x="320" y="384" font-size="11" fill="#4c1d95" font-weight="700" text-anchor="middle">Nenhuma emoção é "ruim": todas trazem uma informação. O problema é a reação sem pensar.</text>
</svg>
