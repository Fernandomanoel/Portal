<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Falar sem atacar: os quatro passos da CNV</text>
  <rect x="26" y="56" width="132" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="92" cy="86" r="16" fill="#7c3aed"/>
  <text x="92" y="92" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="92" y="124" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Observação</text>
  <text x="92" y="146" font-size="10" fill="#6b7280" text-anchor="middle">o fato, sem</text>
  <text x="92" y="161" font-size="10" fill="#6b7280" text-anchor="middle">julgar: "Você chegou</text>
  <text x="92" y="176" font-size="10" fill="#6b7280" text-anchor="middle">às 9h30 três vezes"</text>
  <line x1="160" y1="146" x2="176" y2="146" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="176,146 168.8,149.5 168.8,142.5" fill="#94a3b8"/>
  <rect x="178" y="56" width="132" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="244" cy="86" r="16" fill="#7c3aed"/>
  <text x="244" y="92" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="244" y="124" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Sentimento</text>
  <text x="244" y="146" font-size="10" fill="#6b7280" text-anchor="middle">o que sinto:</text>
  <text x="244" y="161" font-size="10" fill="#6b7280" text-anchor="middle">"fico preocupado"</text>
  <line x1="312" y1="146" x2="328" y2="146" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="328,146 320.8,149.5 320.8,142.5" fill="#94a3b8"/>
  <rect x="330" y="56" width="132" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="396" cy="86" r="16" fill="#7c3aed"/>
  <text x="396" y="92" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="396" y="124" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Necessidade</text>
  <text x="396" y="146" font-size="10" fill="#6b7280" text-anchor="middle">o que preciso:</text>
  <text x="396" y="161" font-size="10" fill="#6b7280" text-anchor="middle">"preciso abrir a loja</text>
  <text x="396" y="176" font-size="10" fill="#6b7280" text-anchor="middle">no horário"</text>
  <line x1="464" y1="146" x2="480" y2="146" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="480,146 472.8,149.5 472.8,142.5" fill="#94a3b8"/>
  <rect x="482" y="56" width="132" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="548" cy="86" r="16" fill="#7c3aed"/>
  <text x="548" y="92" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <text x="548" y="124" font-size="12.5" fill="#1f2937" font-weight="700" text-anchor="middle">Pedido</text>
  <text x="548" y="146" font-size="10" fill="#6b7280" text-anchor="middle">claro e possível:</text>
  <text x="548" y="161" font-size="10" fill="#6b7280" text-anchor="middle">"pode me avisar</text>
  <text x="548" y="176" font-size="10" fill="#6b7280" text-anchor="middle">quando atrasar?"</text>
  <rect x="26" y="256" width="588" height="120" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="44" y="282" font-size="12.5" fill="#7c2d12" font-weight="700">Troque o rótulo pelo fato</text>
  <text x="44" y="308" font-size="11" fill="#7c2d12">Em vez de: "Você é irresponsável."</text>
  <text x="44" y="330" font-size="11" fill="#7c2d12">Diga: "Você chegou depois das 9h três vezes esta semana e eu fiquei</text>
  <text x="44" y="348" font-size="11" fill="#7c2d12">preocupado com a abertura. Pode me avisar quando for atrasar?"</text>
</svg>
