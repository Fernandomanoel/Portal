<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Três jeitos de lidar com a energia social</text>
  <rect x="26" y="48" width="188" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="120" cy="94" r="18" fill="#fcd9b6" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M90 196 V151.6 A30 30 0 0 1 150 151.6 V196 Z" fill="#fb923c" stroke="#1f2937" stroke-width="2.5"/>
  <text x="120" y="222" font-size="14" fill="#1f2937" font-weight="700" text-anchor="middle">Extrovertido</text>
  <rect x="90" y="234" width="54" height="24" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="144" y="241" width="5" height="10" rx="1" fill="#1f2937"/>
  <rect x="94" y="238" width="46" height="16" rx="3" fill="#fb923c"/>
  <text x="120" y="280" font-size="10" fill="#6b7280" text-anchor="middle">recarrega com</text>
  <text x="120" y="294" font-size="10" fill="#6b7280" text-anchor="middle">pessoas e movimento</text>
  <text x="120" y="320" font-size="10.5" fill="#1f2937" text-anchor="middle">pensa falando</text>
  <text x="120" y="336" font-size="10.5" fill="#1f2937" text-anchor="middle">gosta de grupo</text>
  <text x="120" y="352" font-size="10.5" fill="#1f2937" text-anchor="middle">reage na hora</text>
  <rect x="226" y="48" width="188" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="320" cy="94" r="18" fill="#fcd9b6" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M290 196 V151.6 A30 30 0 0 1 350 151.6 V196 Z" fill="#a78bfa" stroke="#1f2937" stroke-width="2.5"/>
  <text x="320" y="222" font-size="14" fill="#1f2937" font-weight="700" text-anchor="middle">Ambivertido</text>
  <rect x="290" y="234" width="54" height="24" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="344" y="241" width="5" height="10" rx="1" fill="#1f2937"/>
  <rect x="294" y="238" width="27.599999999999998" height="16" rx="3" fill="#a78bfa"/>
  <text x="320" y="280" font-size="10" fill="#6b7280" text-anchor="middle">alterna: depende</text>
  <text x="320" y="294" font-size="10" fill="#6b7280" text-anchor="middle">do dia e do lugar</text>
  <text x="320" y="320" font-size="10.5" fill="#1f2937" text-anchor="middle">adapta o ritmo</text>
  <text x="320" y="336" font-size="10.5" fill="#1f2937" text-anchor="middle">ouve e fala</text>
  <text x="320" y="352" font-size="10.5" fill="#1f2937" text-anchor="middle">mistura os dois</text>
  <rect x="426" y="48" width="188" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="520" cy="94" r="18" fill="#fcd9b6" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M490 196 V151.6 A30 30 0 0 1 550 151.6 V196 Z" fill="#38bdf8" stroke="#1f2937" stroke-width="2.5"/>
  <text x="520" y="222" font-size="14" fill="#1f2937" font-weight="700" text-anchor="middle">Introvertido</text>
  <rect x="490" y="234" width="54" height="24" rx="5" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>
  <rect x="544" y="241" width="5" height="10" rx="1" fill="#1f2937"/>
  <rect x="494" y="238" width="13.799999999999999" height="16" rx="3" fill="#38bdf8"/>
  <text x="520" y="280" font-size="10" fill="#6b7280" text-anchor="middle">recarrega com</text>
  <text x="520" y="294" font-size="10" fill="#6b7280" text-anchor="middle">silêncio e tempo só</text>
  <text x="520" y="320" font-size="10.5" fill="#1f2937" text-anchor="middle">pensa antes</text>
  <text x="520" y="336" font-size="10.5" fill="#1f2937" text-anchor="middle">prefere poucos</text>
  <text x="520" y="352" font-size="10.5" fill="#1f2937" text-anchor="middle">reage depois</text>
</svg>
