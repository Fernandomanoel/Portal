<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Diário emocional: um registro por situação</text>
  <rect x="26" y="48" width="588" height="250" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="36" y="60" width="116" height="30" rx="4" fill="#7c3aed"/>
  <text x="94" y="80" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">Situação</text>
  <rect x="36" y="96" width="116" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="94" y="113" font-size="10" fill="#1f2937" text-anchor="middle">Chefe criticou</text>
  <text x="94" y="127" font-size="10" fill="#1f2937" text-anchor="middle">na reunião</text>
  <rect x="36" y="160" width="116" height="58" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="94" y="184" font-size="10" fill="#1f2937" text-anchor="middle">Apresentação amanhã</text>
  <rect x="36" y="224" width="116" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="94" y="248" font-size="10" fill="#1f2937" text-anchor="middle">Amiga não respondeu</text>
  <rect x="154" y="60" width="78" height="30" rx="4" fill="#7c3aed"/>
  <text x="193" y="80" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">Emoção</text>
  <rect x="154" y="96" width="78" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="193" y="120" font-size="10" fill="#1f2937" text-anchor="middle">Raiva</text>
  <rect x="154" y="160" width="78" height="58" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="193" y="184" font-size="10" fill="#1f2937" text-anchor="middle">Medo</text>
  <rect x="154" y="224" width="78" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="193" y="248" font-size="10" fill="#1f2937" text-anchor="middle">Tristeza</text>
  <rect x="234" y="60" width="52" height="30" rx="4" fill="#7c3aed"/>
  <text x="260" y="80" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">0 a 10</text>
  <rect x="234" y="96" width="52" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="120" font-size="10" fill="#1f2937" font-weight="700" text-anchor="middle">7</text>
  <rect x="234" y="160" width="52" height="58" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="184" font-size="10" fill="#1f2937" font-weight="700" text-anchor="middle">6</text>
  <rect x="234" y="224" width="52" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="260" y="248" font-size="10" fill="#1f2937" font-weight="700" text-anchor="middle">4</text>
  <rect x="288" y="60" width="114" height="30" rx="4" fill="#7c3aed"/>
  <text x="345" y="80" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">O que pensei</text>
  <rect x="288" y="96" width="114" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="345" y="120" font-size="10" fill="#1f2937" text-anchor="middle">"Ele quer me expor"</text>
  <rect x="288" y="160" width="114" height="58" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="345" y="184" font-size="10" fill="#1f2937" text-anchor="middle">"Vou travar"</text>
  <rect x="288" y="224" width="114" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="345" y="248" font-size="10" fill="#1f2937" text-anchor="middle">"Ela se afastou"</text>
  <rect x="404" y="60" width="102" height="30" rx="4" fill="#7c3aed"/>
  <text x="455" y="80" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">O que fiz</text>
  <rect x="404" y="96" width="102" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="455" y="120" font-size="10" fill="#1f2937" text-anchor="middle">Fiquei calado</text>
  <rect x="404" y="160" width="102" height="58" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="455" y="184" font-size="10" fill="#1f2937" text-anchor="middle">Ensaiei 2 vezes</text>
  <rect x="404" y="224" width="102" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="455" y="248" font-size="10" fill="#1f2937" text-anchor="middle">Mandei outra msg</text>
  <rect x="508" y="60" width="114" height="30" rx="4" fill="#7c3aed"/>
  <text x="565" y="80" font-size="10.5" fill="#ffffff" font-weight="700" text-anchor="middle">Faria diferente</text>
  <rect x="508" y="96" width="114" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="565" y="113" font-size="10" fill="#1f2937" text-anchor="middle">Pedir conversa</text>
  <text x="565" y="127" font-size="10" fill="#1f2937" text-anchor="middle">a sós</text>
  <rect x="508" y="160" width="114" height="58" rx="4" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="565" y="184" font-size="10" fill="#1f2937" text-anchor="middle">Ensaiar com alguém</text>
  <rect x="508" y="224" width="114" height="58" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="565" y="241" font-size="10" fill="#1f2937" text-anchor="middle">Perguntar se</text>
  <text x="565" y="255" font-size="10" fill="#1f2937" text-anchor="middle">está bem</text>
  <rect x="26" y="312" width="588" height="66" rx="12" fill="#ede9fe" stroke="#c4b5fd" stroke-width="1"/>
  <text x="320" y="338" font-size="11.5" fill="#4c1d95" font-weight="700" text-anchor="middle">Depois de uma ou duas semanas, procure o padrão: que situações se repetem?</text>
  <text x="320" y="358" font-size="11" fill="#4c1d95" text-anchor="middle">Esses são os seus gatilhos — e é neles que vale preparar uma reação melhor.</text>
</svg>
