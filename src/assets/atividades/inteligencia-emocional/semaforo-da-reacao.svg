<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">O semáforo da reação</text>
  <rect x="70" y="50" width="120" height="320" rx="20" fill="#1f2937"/>
  <circle cx="130" cy="110" r="38" fill="#ef4444"/>
  <circle cx="130" cy="210" r="38" fill="#f59e0b"/>
  <circle cx="130" cy="310" r="38" fill="#22c55e"/>
  <rect x="220" y="72" width="394" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="236" y="98" font-size="13" fill="#1f2937" font-weight="700">Vermelho: pare</text>
  <text x="236" y="118" font-size="10.5" fill="#6b7280">Percebeu o corpo esquentar? Não responda ainda.</text>
  <text x="236" y="134" font-size="10.5" fill="#6b7280">Respire, conte até 4, afaste-se se precisar.</text>
  <rect x="220" y="172" width="394" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="236" y="198" font-size="13" fill="#1f2937" font-weight="700">Amarelo: pense</text>
  <text x="236" y="218" font-size="10.5" fill="#6b7280">O que estou sentindo? O que a outra pessoa sente?</text>
  <text x="236" y="234" font-size="10.5" fill="#6b7280">O que eu quero que aconteça depois desta conversa?</text>
  <rect x="220" y="272" width="394" height="78" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="236" y="298" font-size="13" fill="#1f2937" font-weight="700">Verde: aja</text>
  <text x="236" y="318" font-size="10.5" fill="#6b7280">Fale com fatos, em primeira pessoa, com um pedido claro.</text>
  <text x="236" y="334" font-size="10.5" fill="#6b7280">"Eu fiquei... Preciso de... Você pode...?"</text>
</svg>
