<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">As emoções aparecem primeiro no corpo</text>
  <rect x="26" y="48" width="588" height="330" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="320" cy="122" r="42" fill="#fcd9b6" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M250 360 V256.4 A70 70 0 0 1 390 256.4 V360 Z" fill="#c4b5fd" stroke="#1f2937" stroke-width="2.5"/>
  <circle cx="320" cy="112" r="7" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
  <line x1="320" y1="112" x2="256" y2="88" stroke="#f97316" stroke-width="1.5"/>
  <text x="60" y="86" font-size="11.5" fill="#1f2937" font-weight="700">Raiva</text>
  <text x="60" y="102" font-size="10" fill="#6b7280">rosto quente, mandíbula travada</text>
  <circle cx="304" cy="180" r="7" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
  <line x1="304" y1="180" x2="256" y2="168" stroke="#f97316" stroke-width="1.5"/>
  <text x="60" y="166" font-size="11.5" fill="#1f2937" font-weight="700">Medo e ansiedade</text>
  <text x="60" y="182" font-size="10" fill="#6b7280">coração acelerado, respiração curta</text>
  <circle cx="336" cy="196" r="7" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
  <line x1="336" y1="196" x2="400" y2="146" stroke="#f97316" stroke-width="1.5"/>
  <text x="400" y="144" font-size="11.5" fill="#1f2937" font-weight="700">Tristeza</text>
  <text x="400" y="160" font-size="10" fill="#6b7280">peito pesado, nó na garganta</text>
  <circle cx="320" cy="240" r="7" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
  <line x1="320" y1="240" x2="400" y2="226" stroke="#f97316" stroke-width="1.5"/>
  <text x="400" y="224" font-size="11.5" fill="#1f2937" font-weight="700">Ansiedade</text>
  <text x="400" y="240" font-size="10" fill="#6b7280">"frio na barriga", estômago apertado</text>
  <circle cx="282" cy="300" r="7" fill="#f97316" stroke="#ffffff" stroke-width="2"/>
  <line x1="282" y1="300" x2="256" y2="292" stroke="#f97316" stroke-width="1.5"/>
  <text x="60" y="290" font-size="11.5" fill="#1f2937" font-weight="700">Raiva e estresse</text>
  <text x="60" y="306" font-size="10" fill="#6b7280">mãos fechadas, ombros tensos</text>
</svg>
