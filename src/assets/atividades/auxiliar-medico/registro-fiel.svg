<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Como registrar o que o paciente diz</text>
  <rect x="26" y="48" width="288" height="326" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <rect x="326" y="48" width="288" height="326" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <text x="170" y="76" font-size="14" fill="#7f1d1d" font-weight="700" text-anchor="middle">Registro ruim</text>
  <text x="470" y="76" font-size="14" fill="#14532d" font-weight="700" text-anchor="middle">Registro bom</text>
  <rect x="42" y="92" width="256" height="120" rx="8" fill="#ffffff" stroke="#fca5a5" stroke-width="1"/>
  <text x="54" y="114" font-size="11" fill="#1f2937">"Paciente nervoso, parece</text>
  <text x="54" y="130" font-size="11" fill="#1f2937">infarto, está exagerando e</text>
  <text x="54" y="146" font-size="11" fill="#1f2937">não colabora."</text>
  <rect x="342" y="92" width="256" height="120" rx="8" fill="#ffffff" stroke="#86efac" stroke-width="1"/>
  <text x="354" y="114" font-size="10.5" fill="#1f2937">Chegou às 09:10, voz alta, mãos</text>
  <text x="354" y="130" font-size="10.5" fill="#1f2937">trêmulas. Diz: "dor no peito há</text>
  <text x="354" y="146" font-size="10.5" fill="#1f2937">duas horas, piora quando respiro".</text>
  <text x="354" y="162" font-size="10.5" fill="#1f2937" font-weight="700">Médico avisado às 09:12.</text>
  <path d="M46 238 l10 10 m0 -10 l-10 10" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
  <text x="68" y="247" font-size="11" fill="#7f1d1d">Diagnóstico por conta própria</text>
  <path d="M46 272 l10 10 m0 -10 l-10 10" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
  <text x="68" y="281" font-size="11" fill="#7f1d1d">Rótulo (nervoso, exagerado)</text>
  <path d="M46 306 l10 10 m0 -10 l-10 10" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
  <text x="68" y="315" font-size="11" fill="#7f1d1d">Julgamento</text>
  <path d="M346 244 l4 4 l8 -9" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="368" y="247" font-size="11" fill="#14532d">Fatos observados</text>
  <path d="M346 278 l4 4 l8 -9" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="368" y="281" font-size="11" fill="#14532d">Palavras do paciente entre aspas</text>
  <path d="M346 312 l4 4 l8 -9" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="368" y="315" font-size="11" fill="#14532d">Horário e quem foi avisado</text>
</svg>
