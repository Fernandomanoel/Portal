<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Escuta ativa no balcão</text>
  <circle cx="74" cy="102.5" r="16.5" fill="#fcd9b6" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M46.5 196 V155.3 A27.5 27.5 0 0 1 101.5 155.3 V196 Z" fill="#fb923c" stroke="#1f2937" stroke-width="2.5"/>
  <circle cx="566" cy="102.5" r="16.5" fill="#fcd9b6" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M538.5 196 V155.3 A27.5 27.5 0 0 1 593.5 155.3 V196 Z" fill="#0d9488" stroke="#1f2937" stroke-width="2.5"/>
  <rect x="120" y="58" width="210" height="78" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <path d="M130 135 l-4 12 l14 -12 z" fill="#fff7ed" stroke="#fdba74"/>
  <path d="M131 134.5 h13" stroke="#fff7ed" stroke-width="3"/>
  <text x="134" y="80" font-size="11" fill="#1f2937">"Estou com uma coisa</text>
  <text x="134" y="96" font-size="11" fill="#1f2937">estranha desde ontem e</text>
  <text x="134" y="112" font-size="11" fill="#1f2937">não sei explicar..."</text>
  <rect x="318" y="124" width="210" height="78" rx="14" fill="#ccfbf1" stroke="#5eead4" stroke-width="1"/>
  <path d="M502 201 l4 12 l14 -12 z" fill="#ccfbf1" stroke="#5eead4"/>
  <path d="M503 200.5 h13" stroke="#ccfbf1" stroke-width="3"/>
  <text x="332" y="146" font-size="11" fill="#1f2937">"Entendi. Pode me contar</text>
  <text x="332" y="162" font-size="11" fill="#1f2937">com calma o que sentiu</text>
  <text x="332" y="178" font-size="11" fill="#1f2937">e desde quando?"</text>
  <rect x="26" y="226" width="128" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="90" cy="256" r="16" fill="#0d9488"/>
  <text x="90" y="262" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="90" y="294" font-size="10.39426523297491" fill="#1f2937" font-weight="700" text-anchor="middle">Olhe e cumprimente</text>
  <text x="90" y="314" font-size="9.5" fill="#6b7280" text-anchor="middle">sorria, pare o que</text>
  <text x="90" y="328" font-size="9.5" fill="#6b7280" text-anchor="middle">estava fazendo</text>
  <line x1="156" y1="301" x2="177.33333333333334" y2="301" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="177.33333333333334,301 170.1,304.5 170.1,297.5" fill="#94a3b8"/>
  <rect x="179.33333333333334" y="226" width="128" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="243.33333333333334" cy="256" r="16" fill="#0d9488"/>
  <text x="243.33333333333334" y="262" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="243.33333333333334" y="294" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">Ouça até o fim</text>
  <text x="243.33333333333334" y="314" font-size="9.5" fill="#6b7280" text-anchor="middle">sem interromper</text>
  <text x="243.33333333333334" y="328" font-size="9.5" fill="#6b7280" text-anchor="middle">nem terminar a frase</text>
  <line x1="309.33333333333337" y1="301" x2="330.6666666666667" y2="301" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="330.6666666666667,301 323.5,304.5 323.5,297.5" fill="#94a3b8"/>
  <rect x="332.6666666666667" y="226" width="128" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="396.6666666666667" cy="256" r="16" fill="#0d9488"/>
  <text x="396.6666666666667" y="262" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="396.6666666666667" y="294" font-size="7.795698924731183" fill="#1f2937" font-weight="700" text-anchor="middle">Repita com suas palavras</text>
  <text x="396.6666666666667" y="314" font-size="9.5" fill="#6b7280" text-anchor="middle">"Entendi que...", para</text>
  <text x="396.6666666666667" y="328" font-size="9.5" fill="#6b7280" text-anchor="middle">conferir se entendeu</text>
  <line x1="462.6666666666667" y1="301" x2="484" y2="301" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="484,301 476.8,304.5 476.8,297.5" fill="#94a3b8"/>
  <rect x="486" y="226" width="128" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="550" cy="256" r="16" fill="#0d9488"/>
  <text x="550" y="262" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <text x="550" y="294" font-size="8.134642356241235" fill="#1f2937" font-weight="700" text-anchor="middle">Oriente o próximo passo</text>
  <text x="550" y="314" font-size="9.5" fill="#6b7280" text-anchor="middle">diga o que vai</text>
  <text x="550" y="328" font-size="9.5" fill="#6b7280" text-anchor="middle">acontecer agora</text>
</svg>
