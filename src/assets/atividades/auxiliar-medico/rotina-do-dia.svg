<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">A rotina do secretariado médico</text>
  <rect x="26" y="48" width="188" height="326" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="26" y="48" width="188" height="36" rx="12" fill="#0d9488"/>
  <rect x="26" y="70" width="188" height="14" rx="0" fill="#0d9488"/>
  <text x="120" y="72" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Antes de abrir</text>
  <circle cx="46" cy="112" r="5" fill="#0d9488"/>
  <text x="60" y="116" font-size="10.5" fill="#1f2937">Conferir a agenda do dia</text>
  <circle cx="46" cy="162" r="5" fill="#0d9488"/>
  <text x="60" y="166" font-size="10.5" fill="#1f2937">Separar os prontuários</text>
  <circle cx="46" cy="212" r="5" fill="#0d9488"/>
  <text x="60" y="216" font-size="10.5" fill="#1f2937">Ligar equipamentos</text>
  <circle cx="46" cy="262" r="5" fill="#0d9488"/>
  <text x="60" y="266" font-size="10.5" fill="#1f2937">Repor impressos e canetas</text>
  <circle cx="46" cy="312" r="5" fill="#0d9488"/>
  <text x="60" y="316" font-size="10.5" fill="#1f2937">Ver recados e faltas</text>
  <line x1="216" y1="210" x2="224" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="224,210 216.8,213.5 216.8,206.5" fill="#94a3b8"/>
  <rect x="226" y="48" width="188" height="326" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="226" y="48" width="188" height="36" rx="12" fill="#2563eb"/>
  <rect x="226" y="70" width="188" height="14" rx="0" fill="#2563eb"/>
  <text x="320" y="72" font-size="13" fill="#ffffff" font-weight="700" text-anchor="middle">Durante o dia</text>
  <circle cx="246" cy="112" r="5" fill="#2563eb"/>
  <text x="260" y="116" font-size="10.5" fill="#1f2937">Receber e registrar a chegada</text>
  <circle cx="246" cy="162" r="5" fill="#2563eb"/>
  <text x="260" y="166" font-size="10.5" fill="#1f2937">Avisar o médico</text>
  <circle cx="246" cy="212" r="5" fill="#2563eb"/>
  <text x="260" y="216" font-size="10.5" fill="#1f2937">Chamar pelo nome completo</text>
  <circle cx="246" cy="262" r="5" fill="#2563eb"/>
  <text x="260" y="266" font-size="10.5" fill="#1f2937">Atender telefone e e-mail</text>
  <circle cx="246" cy="312" r="5" fill="#2563eb"/>
  <text x="260" y="316" font-size="10.5" fill="#1f2937">Agendar retornos</text>
  <line x1="416" y1="210" x2="424" y2="210" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="424,210 416.8,213.5 416.8,206.5" fill="#94a3b8"/>
  <rect x="426" y="48" width="188" height="326" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="426" y="48" width="188" height="36" rx="12" fill="#d97706"/>
  <rect x="426" y="70" width="188" height="14" rx="0" fill="#d97706"/>
