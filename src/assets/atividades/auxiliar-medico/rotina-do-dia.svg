  <circle cx="446" cy="112" r="5" fill="#d97706"/>
  <text x="460" y="116" font-size="10.5" fill="#1f2937">Completar os registros</text>
  <circle cx="446" cy="162" r="5" fill="#d97706"/>
  <text x="460" y="166" font-size="10.5" fill="#1f2937">Arquivar prontuários</text>
  <circle cx="446" cy="212" r="5" fill="#d97706"/>
  <text x="460" y="216" font-size="10.5" fill="#1f2937">Reconfirmar o dia seguinte</text>
  <circle cx="446" cy="262" r="5" fill="#d97706"/>
  <text x="460" y="266" font-size="10.5" fill="#1f2937">Fechar contas e caixa</text>
  <circle cx="446" cy="312" r="5" fill="#d97706"/>
  <text x="460" y="316" font-size="10.5" fill="#1f2937">Desligar e trancar</text>
