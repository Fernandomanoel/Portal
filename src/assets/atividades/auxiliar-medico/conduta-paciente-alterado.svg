<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Paciente alterado ou que não sabe explicar</text>
  <circle cx="70" cy="96.5" r="16.5" fill="#fcd9b6" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M42.5 190 V149.3 A27.5 27.5 0 0 1 97.5 149.3 V190 Z" fill="#fb923c" stroke="#1f2937" stroke-width="2.5"/>
  <circle cx="570" cy="96.5" r="16.5" fill="#fcd9b6" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M542.5 190 V149.3 A27.5 27.5 0 0 1 597.5 149.3 V190 Z" fill="#0d9488" stroke="#1f2937" stroke-width="2.5"/>
  <rect x="116" y="52" width="210" height="78" rx="14" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <path d="M126 129 l-4 12 l14 -12 z" fill="#fff7ed" stroke="#fdba74"/>
  <path d="M127 128.5 h13" stroke="#fff7ed" stroke-width="3"/>
  <text x="130" y="74" font-size="11" fill="#1f2937">"Eu... não sei... tá</text>
  <text x="130" y="90" font-size="11" fill="#1f2937">diferente aqui, ninguém</text>
  <text x="130" y="106" font-size="11" fill="#1f2937">me explica nada!"</text>
  <rect x="314" y="112" width="214" height="78" rx="14" fill="#ccfbf1" stroke="#5eead4" stroke-width="1"/>
  <path d="M502 189 l4 12 l14 -12 z" fill="#ccfbf1" stroke="#5eead4"/>
  <path d="M503 188.5 h13" stroke="#ccfbf1" stroke-width="3"/>
  <text x="328" y="134" font-size="11" fill="#1f2937">"Estou aqui com o senhor.</text>
  <text x="328" y="150" font-size="11" fill="#1f2937">Vamos devagar. Vou chamar</text>
  <text x="328" y="166" font-size="11" fill="#1f2937">quem pode ajudar agora."</text>
  <rect x="26" y="214" width="108" height="162" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="80" cy="244" r="16" fill="#0d9488"/>
  <text x="80" y="250" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="80" y="282" font-size="9.108159392789375" fill="#1f2937" font-weight="700" text-anchor="middle">Calma e distância</text>
  <text x="80" y="302" font-size="9.5" fill="#6b7280" text-anchor="middle">voz baixa e lenta,</text>
  <text x="80" y="316" font-size="8.888888888888888" fill="#6b7280" text-anchor="middle">espaço para a pessoa</text>
  <line x1="136" y1="295" x2="144" y2="295" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="144,295 136.8,298.5 136.8,291.5" fill="#94a3b8"/>
  <rect x="146" y="214" width="108" height="162" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="200" cy="244" r="16" fill="#0d9488"/>
  <text x="200" y="250" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="200" y="282" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">Ouvir</text>
  <text x="200" y="302" font-size="9.5" fill="#6b7280" text-anchor="middle">sem discutir nem</text>
  <text x="200" y="316" font-size="9.5" fill="#6b7280" text-anchor="middle">dizer "calma!"</text>
  <line x1="256" y1="295" x2="264" y2="295" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="264,295 256.8,298.5 256.8,291.5" fill="#94a3b8"/>
  <rect x="266" y="214" width="108" height="162" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="320" cy="244" r="16" fill="#0d9488"/>
  <text x="320" y="250" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="320" y="282" font-size="9.108159392789375" fill="#1f2937" font-weight="700" text-anchor="middle">Perguntas simples</text>
  <text x="320" y="302" font-size="9.5" fill="#6b7280" text-anchor="middle">uma de cada vez,</text>
  <text x="320" y="316" font-size="9.5" fill="#6b7280" text-anchor="middle">"onde dói?"</text>
  <line x1="376" y1="295" x2="384" y2="295" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="384,295 376.8,298.5 376.8,291.5" fill="#94a3b8"/>
  <rect x="386" y="214" width="108" height="162" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="440" cy="244" r="16" fill="#0d9488"/>
  <text x="440" y="250" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <text x="440" y="282" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">Chamar apoio</text>
  <text x="440" y="302" font-size="9.5" fill="#6b7280" text-anchor="middle">médico ou equipe,</text>
  <text x="440" y="316" font-size="8.08080808080808" fill="#6b7280" text-anchor="middle">sem deixar a pessoa só</text>
  <line x1="496" y1="295" x2="504" y2="295" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="504,295 496.8,298.5 496.8,291.5" fill="#94a3b8"/>
  <rect x="506" y="214" width="108" height="162" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="560" cy="244" r="16" fill="#0d9488"/>
  <text x="560" y="250" font-size="15" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
  <text x="560" y="282" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">Registrar</text>
  <text x="560" y="302" font-size="9.5" fill="#6b7280" text-anchor="middle">o que foi dito e</text>
  <text x="560" y="316" font-size="9.5" fill="#6b7280" text-anchor="middle">visto, sem rótulos</text>
</svg>
