<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Quem tem prioridade no atendimento</text>
  <rect x="26" y="48" width="588" height="214" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <circle cx="70" cy="115" r="15" fill="#fcd9b6" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M45 200 V163 A25 25 0 0 1 95 163 V200 Z" fill="#a78bfa" stroke="#1f2937" stroke-width="2.5"/>
  <text x="70" y="222" font-size="9" fill="#1f2937" font-weight="700" text-anchor="middle">Idosa, 82 anos</text>
  <text x="70" y="236" font-size="8" fill="#16a34a" text-anchor="middle">prioridade especial (80+)</text>
  <circle cx="70" cy="80" r="11" fill="#16a34a"/>
  <text x="70" y="85" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <circle cx="166" cy="115" r="15" fill="#fcd9b6" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M141 200 V163 A25 25 0 0 1 191 163 V200 Z" fill="#f472b6" stroke="#1f2937" stroke-width="2.5"/>
  <text x="166" y="222" font-size="9" fill="#1f2937" font-weight="700" text-anchor="middle">Gestante</text>
  <text x="166" y="236" font-size="8" fill="#16a34a" text-anchor="middle">prioridade legal</text>
  <circle cx="166" cy="80" r="11" fill="#16a34a"/>
  <text x="166" y="85" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <circle cx="262" cy="115" r="15" fill="#fcd9b6" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M237 200 V163 A25 25 0 0 1 287 163 V200 Z" fill="#38bdf8" stroke="#1f2937" stroke-width="2.5"/>
  <text x="262" y="222" font-size="9" fill="#1f2937" font-weight="700" text-anchor="middle">Com deficiência</text>
  <text x="262" y="236" font-size="8" fill="#16a34a" text-anchor="middle">prioridade legal</text>
  <circle cx="262" cy="80" r="11" fill="#16a34a"/>
  <text x="262" y="85" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <circle cx="358" cy="115" r="15" fill="#fcd9b6" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M333 200 V163 A25 25 0 0 1 383 163 V200 Z" fill="#fb923c" stroke="#1f2937" stroke-width="2.5"/>
  <text x="358" y="222" font-size="9" fill="#1f2937" font-weight="700" text-anchor="middle">Adulto com bebê</text>
  <text x="358" y="236" font-size="8" fill="#16a34a" text-anchor="middle">prioridade legal</text>
  <circle cx="358" cy="80" r="11" fill="#16a34a"/>
  <text x="358" y="85" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <circle cx="454" cy="115" r="15" fill="#fcd9b6" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M429 200 V163 A25 25 0 0 1 479 163 V200 Z" fill="#34d399" stroke="#1f2937" stroke-width="2.5"/>
  <text x="454" y="222" font-size="9" fill="#1f2937" font-weight="700" text-anchor="middle">Idoso, 65 anos</text>
  <text x="454" y="236" font-size="8" fill="#16a34a" text-anchor="middle">prioridade legal</text>
  <circle cx="454" cy="80" r="11" fill="#16a34a"/>
  <text x="454" y="85" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
  <circle cx="550" cy="115" r="15" fill="#fcd9b6" stroke="#1f2937" stroke-width="2.5"/>
  <path d="M525 200 V163 A25 25 0 0 1 575 163 V200 Z" fill="#94a3b8" stroke="#1f2937" stroke-width="2.5"/>
  <text x="550" y="222" font-size="9" fill="#1f2937" font-weight="700" text-anchor="middle">Adulto, 34 anos</text>
  <text x="550" y="236" font-size="8" fill="#6b7280" text-anchor="middle">ordem de chegada</text>
  <circle cx="550" cy="80" r="11" fill="#94a3b8"/>
  <text x="550" y="85" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
  <rect x="26" y="276" width="288" height="100" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="42" y="302" font-size="12" fill="#7f1d1d" font-weight="700">Urgência clínica passa na frente</text>
  <text x="42" y="322" font-size="10.5" fill="#7f1d1d">de qualquer fila: falta de ar, dor forte</text>
  <text x="42" y="338" font-size="10.5" fill="#7f1d1d">no peito, desmaio, sangramento. Avise</text>
  <text x="42" y="354" font-size="10.5" fill="#7f1d1d">o médico ou a equipe na hora.</text>
  <rect x="326" y="276" width="288" height="100" rx="12" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="342" y="302" font-size="12" fill="#1f2937" font-weight="700">Dentro do grupo prioritário</text>
  <text x="342" y="322" font-size="10.5" fill="#1f2937">vale a ordem de chegada.</text>
  <text x="342" y="342" font-size="10.5" fill="#6b7280">Explique com educação a</text>
  <text x="342" y="358" font-size="10.5" fill="#6b7280">quem aguarda: é regra, não favor.</text>
