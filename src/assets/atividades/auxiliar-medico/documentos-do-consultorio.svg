<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Documentos: quem faz o quê</text>
  <rect x="26" y="48" width="288" height="326" rx="12" fill="#ccfbf1" stroke="#5eead4" stroke-width="1"/>
  <rect x="326" y="48" width="288" height="326" rx="12" fill="#dbeafe" stroke="#93c5fd" stroke-width="1"/>
  <text x="170" y="76" font-size="15" fill="#134e4a" font-weight="700" text-anchor="middle">O médico</text>
  <text x="470" y="76" font-size="15" fill="#1e3a8a" font-weight="700" text-anchor="middle">A secretária</text>
  <path d="M44 112 l4 4 l8 -9" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="115" font-size="11" fill="#134e4a">Decide e assina o atestado</text>
  <path d="M44 156 l4 4 l8 -9" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="159" font-size="11" fill="#134e4a">Prescreve e assina a receita</text>
  <path d="M44 200 l4 4 l8 -9" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="203" font-size="11" fill="#134e4a">Pede os exames</text>
  <path d="M44 244 l4 4 l8 -9" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="247" font-size="11" fill="#134e4a">Interpreta resultados</text>
  <path d="M44 288 l4 4 l8 -9" fill="none" stroke="#0d9488" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="66" y="291" font-size="11" fill="#134e4a">Orienta o tratamento</text>
  <path d="M344 112 l4 4 l8 -9" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="366" y="115" font-size="11" fill="#1e3a8a">Organiza a agenda e os dados</text>
  <path d="M344 156 l4 4 l8 -9" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="366" y="159" font-size="11" fill="#1e3a8a">Prepara o papel e as guias</text>
  <path d="M344 200 l4 4 l8 -9" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="366" y="203" font-size="11" fill="#1e3a8a">Entrega o que o médico assinou</text>
  <path d="M344 244 l4 4 l8 -9" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="366" y="247" font-size="11" fill="#1e3a8a">Arquiva em ordem e com sigilo</text>
  <path d="M344 288 l4 4 l8 -9" fill="none" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="366" y="291" font-size="11" fill="#1e3a8a">Confere convênio e protocolos</text>
  <rect x="344" y="332" width="252" height="28" rx="8" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="356" y="351" font-size="9.5" fill="#7f1d1d" font-weight="700">Nunca assina nem altera documento do médico.</text>
</svg>
