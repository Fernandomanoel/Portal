  <rect x="60" y="130" width="80" height="22" rx="8" fill="#94a3b8"/>  <circle cx="100" cy="100" r="24" fill="#ffffff" stroke="#1f2937"/>  <path d="M100 100 L112 86" stroke="#dc2626" stroke-width="2.5"/>  <line x1="100" y1="152" x2="100" y2="190" stroke="#1f2937" stroke-width="3"/>  <circle cx="100" cy="200" r="10" fill="#1f2937"/>
  <text x="100" y="262" font-size="11.5" fill="#1f2937" font-weight="700" text-anchor="middle">Esfigmomanômetro</text>
  <text x="100" y="280" font-size="9.5" fill="#6b7280" text-anchor="middle">pressão arterial</text>
  <path d="M215 80 C215 140 265 140 265 80" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/><path d="M240 130 C240 180 215 200 215 210" fill="none" stroke="#1f2937" stroke-width="5" stroke-linecap="round"/>  <circle cx="215" cy="214" r="13" fill="#94a3b8" stroke="#1f2937"/>  <circle cx="215" cy="76" r="5" fill="#1f2937"/>  <circle cx="265" cy="76" r="5" fill="#1f2937"/>
  <text x="240" y="262" font-size="11.5" fill="#1f2937" font-weight="700" text-anchor="middle">Estetoscópio</text>
  <text x="240" y="280" font-size="9.5" fill="#6b7280" text-anchor="middle">ouvir pulso e pulmão</text>
  <rect x="335" y="150" width="90" height="14" rx="7" fill="#e5e7eb" stroke="#1f2937" stroke-width="2"/>  <rect x="335" y="150" width="36" height="14" rx="7" fill="#fca5a5"/>  <circle cx="430" cy="157" r="7" fill="#dc2626"/>  <text x="380" y="130" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">36,5 °C</text>
  <text x="380" y="262" font-size="11.5" fill="#1f2937" font-weight="700" text-anchor="middle">Termômetro</text>
  <text x="380" y="280" font-size="9.5" fill="#6b7280" text-anchor="middle">temperatura</text>
  <rect x="480" y="150" width="80" height="50" rx="8" fill="#94a3b8" stroke="#1f2937" stroke-width="2"/>  <rect x="492" y="124" width="56" height="28" rx="4" fill="#ffffff" stroke="#1f2937" stroke-width="2"/>  <text x="520" y="144" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">72,4</text>  <circle cx="520" cy="176" r="9" fill="#ffffff" stroke="#1f2937"/>
  <text x="520" y="262" font-size="11.5" fill="#1f2937" font-weight="700" text-anchor="middle">Balança e fita</text>
  <text x="520" y="280" font-size="9.5" fill="#6b7280" text-anchor="middle">peso e altura (IMC)</text>
  <rect x="60" y="306" width="520" height="52" rx="10" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="320" y="328" font-size="11.5" fill="#78350f" font-weight="700" text-anchor="middle">Antes de usar: confira se funciona, se está limpo e se a bateria/escala está certa.</text>
  <text x="320" y="346" font-size="11" fill="#78350f" text-anchor="middle">Defeito se avisa e anota — nunca se "dá um jeito".</text>
