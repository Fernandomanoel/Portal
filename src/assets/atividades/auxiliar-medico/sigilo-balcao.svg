<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Sigilo: o que pode e o que não pode</text>
  <rect x="26" y="48" width="286" height="326" rx="12" fill="#dcfce7" stroke="#86efac" stroke-width="1"/>
  <rect x="328" y="48" width="286" height="326" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="169" y="76" font-size="15" fill="#14532d" font-weight="700" text-anchor="middle">Pode</text>
  <text x="471" y="76" font-size="15" fill="#7f1d1d" font-weight="700" text-anchor="middle">Não pode</text>
  <path d="M42 108 l4 4 l8 -9" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="110" font-size="10.5" fill="#14532d">Confirmar horário com o próprio</text>
  <text x="64" y="124" font-size="10.5" fill="#14532d">paciente</text>
  <path d="M42 160 l4 4 l8 -9" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="162" font-size="10.5" fill="#14532d">Dizer quais documentos levar</text>
  <path d="M42 212 l4 4 l8 -9" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="214" font-size="10.5" fill="#14532d">Falar em voz baixa e em local</text>
  <text x="64" y="228" font-size="10.5" fill="#14532d">reservado</text>
  <path d="M42 264 l4 4 l8 -9" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="266" font-size="10.5" fill="#14532d">Fechar a tela e guardar o</text>
  <text x="64" y="280" font-size="10.5" fill="#14532d">prontuário</text>
  <path d="M42 316 l4 4 l8 -9" fill="none" stroke="#16a34a" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="64" y="318" font-size="10.5" fill="#14532d">Pedir autorização para falar com</text>
  <text x="64" y="332" font-size="10.5" fill="#14532d">terceiros</text>
  <path d="M344 102 l10 10 m0 -10 l-10 10" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
  <text x="366" y="110" font-size="10.5" fill="#7f1d1d">Dizer o motivo da consulta em voz</text>
  <text x="366" y="124" font-size="10.5" fill="#7f1d1d">alta</text>
  <path d="M344 154 l10 10 m0 -10 l-10 10" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
  <text x="366" y="162" font-size="10.5" fill="#7f1d1d">Passar resultado a vizinho ou</text>
  <text x="366" y="176" font-size="10.5" fill="#7f1d1d">colega</text>
  <path d="M344 206 l10 10 m0 -10 l-10 10" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
  <text x="366" y="214" font-size="10.5" fill="#7f1d1d">Informar por telefone a quem não é</text>
  <text x="366" y="228" font-size="10.5" fill="#7f1d1d">o paciente</text>
  <path d="M344 258 l10 10 m0 -10 l-10 10" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
  <text x="366" y="266" font-size="10.5" fill="#7f1d1d">Deixar prontuário aberto no balcão</text>
  <path d="M344 310 l10 10 m0 -10 l-10 10" fill="none" stroke="#dc2626" stroke-width="2.4" stroke-linecap="round"/>
  <text x="366" y="318" font-size="10.5" fill="#7f1d1d">Comentar casos nas redes sociais</text>
</svg>
