<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">Sinais de alerta: chame ajuda na hora</text>
  <rect x="26" y="48" width="380" height="326" rx="12" fill="#fee2e2" stroke="#fca5a5" stroke-width="1"/>
  <text x="44" y="76" font-size="12.5" fill="#7f1d1d" font-weight="700">Avise o médico ou a equipe imediatamente</text>
  <circle cx="50" cy="108" r="5" fill="#dc2626"/>
  <text x="64" y="112" font-size="11" fill="#7f1d1d">Dor forte no peito ou falta de ar</text>
  <circle cx="50" cy="150" r="5" fill="#dc2626"/>
  <text x="64" y="154" font-size="11" fill="#7f1d1d">Desmaio ou confusão de repente</text>
  <circle cx="50" cy="192" r="5" fill="#dc2626"/>
  <text x="64" y="196" font-size="11" fill="#7f1d1d">Fala enrolada, boca torta, fraqueza de um lado</text>
  <circle cx="50" cy="234" r="5" fill="#dc2626"/>
  <text x="64" y="238" font-size="11" fill="#7f1d1d">Sangramento que não para</text>
  <circle cx="50" cy="276" r="5" fill="#dc2626"/>
  <text x="64" y="280" font-size="11" fill="#7f1d1d">Convulsão ou engasgo</text>
  <circle cx="50" cy="318" r="5" fill="#dc2626"/>
  <text x="64" y="322" font-size="11" fill="#7f1d1d">Pessoa que se machuca ou ameaça se machucar</text>
  <rect x="424" y="48" width="190" height="150" rx="12" fill="#7f1d1d" stroke="#7f1d1d" stroke-width="1"/>
  <text x="519" y="96" font-size="24" fill="#ffffff" font-weight="700" text-anchor="middle">SAMU</text>
  <text x="519" y="142" font-size="44" fill="#fef08a" font-weight="700" text-anchor="middle">192</text>
  <text x="519" y="172" font-size="10.5" fill="#fecaca" text-anchor="middle">ligue sem hesitar</text>
  <rect x="424" y="212" width="190" height="162" rx="12" fill="#fef3c7" stroke="#fcd34d" stroke-width="1"/>
  <text x="438" y="238" font-size="11" fill="#78350f" font-weight="700">Enquanto a ajuda não chega</text>
  <text x="438" y="260" font-size="10.5" fill="#78350f">Fique com a pessoa.</text>
  <text x="438" y="278" font-size="10.5" fill="#78350f">Mantenha a calma e o local</text>
  <text x="438" y="294" font-size="10.5" fill="#78350f">livre.</text>
  <text x="438" y="316" font-size="10.5" fill="#78350f">Faça só o que sabe e</text>
  <text x="438" y="332" font-size="10.5" fill="#78350f">foi orientado a fazer.</text>
</svg>
