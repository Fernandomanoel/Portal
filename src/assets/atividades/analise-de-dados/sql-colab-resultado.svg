<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#cbd5e1"/>
  <rect x="10" y="8" width="620" height="384" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="10" y="8" width="620" height="30" rx="10" fill="#e2e8f0"/>
  <rect x="24" y="14" width="150" height="24" rx="8" fill="#ffffff"/>
  <text x="36" y="30" font-size="10.5" fill="#1f2937">Google Colab</text>
  <rect x="10" y="38" width="620" height="30" rx="0" fill="#f1f5f9"/>
  <rect x="56" y="43" width="460" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="57" font-size="11" fill="#1f2937">colab.research.google.com/drive/…</text>
  <circle cx="30" cy="53" r="5" fill="#cbd5e1"/><circle cx="46" cy="53" r="5" fill="#cbd5e1"/>
  <circle cx="596" cy="53" r="11" fill="#7c3aed"/>  <text x="596" y="57" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">A</text>
  <rect x="10" y="68" width="620" height="280" rx="0" fill="#ffffff"/>
  <circle cx="48" cy="112" r="14" fill="#475569"/><path d="M43.8 105.7 L55 112 L43.8 118.3 Z" fill="#ffffff"/>
  <rect x="70" y="88" width="548" height="56" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="82" y="110" font-size="12" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">sql("""</text>
  <text x="82" y="128" font-size="10.5" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">SELECT COUNT(*) AS sem_email FROM clientes_brutos WHERE email IS NULL</text>
  <text x="82" y="140" font-size="12" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">""")</text>
  <rect x="70" y="158" width="548" height="78" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <rect x="80" y="166" width="200" height="22" rx="0" fill="#e2e8f0"/>
  <text x="130" y="181" font-size="11" fill="#1f2937" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">sem_email</text>
  <rect x="80" y="188" width="200" height="24" rx="0" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="96" y="205" font-size="11" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">0</text>
  <text x="176" y="205" font-size="12" fill="#047857" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">5</text>
  <rect x="168" y="188" width="60" height="24" rx="4" fill="none" stroke="#ffffff" stroke-width="10"/>
  <rect x="168" y="188" width="60" height="24" rx="4" fill="none" stroke="#ea580c" stroke-width="5"/>
  <text x="300" y="188" font-size="10.5" fill="#6b7280">1 linha × 1 coluna</text>
  <text x="300" y="206" font-size="11" fill="#ea580c" font-weight="700">← é este valor que você digita no portal</text>
  <text x="34" y="266" font-size="11" fill="#1f2937">sql("...") é a função criada no código de preparação: ela envia o seu comando</text>
  <text x="34" y="284" font-size="11" fill="#1f2937">ao banco e mostra o resultado como tabela. Os três pares de aspas permitem</text>
  <text x="34" y="302" font-size="11" fill="#1f2937">escrever o comando em várias linhas.</text>
  <circle cx="626" cy="90" r="10" fill="#b45309"/>
  <text x="626" y="94" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
  <circle cx="626" cy="160" r="10" fill="#b45309"/>
  <text x="626" y="164" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
  <rect x="20" y="338" width="600" height="50" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <circle cx="34" cy="353" r="10" fill="#b45309"/>
  <text x="34" y="357" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
  <text x="50" y="357" font-size="10.5" fill="#1f2937">Seu comando SQL vai dentro de sql(""" ... """)</text>
  <circle cx="334" cy="353" r="10" fill="#b45309"/>
  <text x="334" y="357" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
  <text x="350" y="357" font-size="10.5" fill="#1f2937">O banco devolve uma tabela</text>
  <circle cx="34" cy="371" r="10" fill="#b45309"/>
  <text x="34" y="375" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">3</text>
  <text x="50" y="375" font-size="10.5" fill="#1f2937">Copie o número para o portal</text>
</svg>
