<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#cbd5e1"/>
  <rect x="10" y="8" width="620" height="384" rx="10" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="10" y="8" width="620" height="30" rx="10" fill="#e2e8f0"/>
  <rect x="24" y="14" width="150" height="24" rx="8" fill="#ffffff"/>
  <text x="36" y="30" font-size="10.5" fill="#1f2937">Google Colab</text>
  <rect x="10" y="38" width="620" height="30" rx="0" fill="#f1f5f9"/>
  <rect x="56" y="43" width="460" height="20" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="70" y="57" font-size="11" fill="#1f2937">colab.research.google.com/drive/…</text>
  <circle cx="30" cy="53" r="5" fill="#cbd5e1"/><circle cx="46" cy="53" r="5" fill="#cbd5e1"/>
  <circle cx="596" cy="53" r="11" fill="#7c3aed"/>  <text x="596" y="57" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">A</text>
  <rect x="10" y="68" width="620" height="280" rx="0" fill="#ffffff"/>
  <text x="34" y="96" font-size="13" fill="#1f2937" font-weight="700">Escreva o código na célula e execute:</text>
  <circle cx="64" cy="160" r="20" fill="#475569"/><path d="M58 151 L74 160 L58 169 Z" fill="#ffffff"/>
  <circle cx="64" cy="160" r="30" fill="none" stroke="#ffffff" stroke-width="10"/>
  <circle cx="64" cy="160" r="30" fill="none" stroke="#ea580c" stroke-width="5"/>
  <rect x="100" y="130" width="500" height="60" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
  <text x="114" y="166" font-size="15" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">print("Olá, mundo!")</text>
  <rect x="100" y="202" width="500" height="44" rx="6" fill="#ffffff" stroke="#e2e8f0" stroke-width="1"/>
  <text x="114" y="230" font-size="15" fill="#047857" font-family="Consolas, Menlo, monospace" xml:space="preserve">Olá, mundo!</text>
  <text x="560" y="236" font-size="11" fill="#047857" font-weight="700" text-anchor="middle">0 s</text>
  <text x="34" y="276" font-size="12" fill="#1f2937" font-weight="700">Ou use o teclado:</text>
  <rect x="160" y="265" width="58" height="30" rx="6" fill="#cbd5e1"/>
  <rect x="160" y="262" width="58" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="189" y="282" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">Shift</text>
  <text x="226" y="281" font-size="14" fill="#1f2937" font-weight="700" text-anchor="middle">+</text>
  <rect x="238" y="265" width="58" height="30" rx="6" fill="#cbd5e1"/>
  <rect x="238" y="262" width="58" height="30" rx="6" fill="#ffffff" stroke="#94a3b8"/>
  <text x="267" y="282" font-size="12" font-weight="700" fill="#1f2937" text-anchor="middle">Enter</text>
  <rect x="330" y="258" width="280" height="66" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="342" y="278" font-size="10.5" fill="#1f2937" font-weight="700">Pode aparecer «Conectando…»:</text>
  <text x="342" y="296" font-size="10.5" fill="#1f2937">o Google está ligando um computador para você.</text>
  <text x="342" y="312" font-size="10.5" fill="#1f2937">Espere uns segundos: é normal.</text>
  <rect x="20" y="338" width="600" height="50" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <circle cx="34" cy="353" r="10" fill="#b45309"/>
  <text x="34" y="357" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
  <text x="50" y="357" font-size="10.5" fill="#1f2937">Clique no botão de play ou aperte Shift + Enter</text>
  <circle cx="334" cy="353" r="10" fill="#b45309"/>
  <text x="334" y="357" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
  <text x="350" y="357" font-size="10.5" fill="#1f2937">O resultado aparece logo abaixo da célula</text>
  <circle cx="34" cy="371" r="10" fill="#b45309"/>
  <text x="34" y="375" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">3</text>
  <text x="50" y="375" font-size="10.5" fill="#1f2937">Só digite no código; não precisa salvar</text>
</svg>
