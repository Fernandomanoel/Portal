  <text x="34" y="228" font-size="12" fill="#1f2937" font-weight="700">Depois do clique:</text>
  <text x="34" y="252" font-size="11" fill="#1f2937">1.  O portal copia a tabela inteira (cada coluna separada por tabulação).</text>
  <text x="34" y="272" font-size="11" fill="#1f2937">2.  Abra o Excel (ou os Planilhas Google), clique na célula A1 e aperte Ctrl + V.</text>
  <text x="34" y="292" font-size="11" fill="#1f2937">3.  Para o Python/SQL: Arquivo &gt; Salvar como &gt; «CSV UTF-8 (delimitado por vírgulas)».</text>
