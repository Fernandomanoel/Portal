  <text x="29" y="52" font-size="7.5" fill="#1f2937" font-weight="700" text-anchor="middle">SQL+</text>
  <rect x="74" y="38" width="22" height="20" rx="4" fill="#fef9c3" stroke="#ca8a04" stroke-width="1"/>
  <path d="M87 41 l-6 10 h5 l-2 8 l8 -11 h-5 z" fill="#ca8a04"/>
  <rect x="70" y="35" width="30" height="26" rx="6" fill="none" stroke="#ffffff" stroke-width="10"/>
  <rect x="70" y="35" width="30" height="26" rx="6" fill="none" stroke="#ea580c" stroke-width="5"/>
  <rect x="10" y="62" width="130" height="240" rx="0" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="20" y="80" font-size="10.5" fill="#6b7280" font-weight="700">SCHEMAS</text>
  <text x="20" y="100" font-size="11" fill="#1f2937" font-weight="700">▸ atividade</text>
  <text x="32" y="118" font-size="10.5" fill="#6b7280">▸ Tables</text>
  <rect x="148" y="70" width="474" height="104" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="180" y="90" font-size="11" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">USE atividade;</text>
  <text x="180" y="108" font-size="11" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve"></text>
  <text x="180" y="126" font-size="11" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">SELECT COUNT(*)</text>
  <text x="180" y="144" font-size="11" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">FROM clientes_brutos</text>
  <text x="180" y="162" font-size="11" fill="#1f2937" font-family="Consolas, Menlo, monospace" xml:space="preserve">WHERE email IS NULL;</text>
  <text x="160" y="90" font-size="9.5" fill="#6b7280">1</text>
  <text x="160" y="108" font-size="9.5" fill="#6b7280">2</text>
  <text x="160" y="126" font-size="9.5" fill="#6b7280">3</text>
  <text x="160" y="144" font-size="9.5" fill="#6b7280">4</text>
  <text x="160" y="162" font-size="9.5" fill="#6b7280">5</text>
  <rect x="148" y="184" width="474" height="80" rx="4" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="148" y="184" width="474" height="20" rx="0" fill="#e2e8f0"/>
  <text x="170" y="198" font-size="10.5" fill="#1f2937" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">COUNT(*)</text>
  <text x="170" y="222" font-size="12" fill="#047857" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">5</text>
  <text x="252" y="222" font-size="10.5" fill="#ea580c" font-weight="700">← o número que você digita no portal</text>
  <rect x="148" y="270" width="474" height="30" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="160" y="290" font-size="10.5" fill="#047857">✓ 1 row(s) returned   0,0004 sec   (Action Output)</text>
  <circle cx="160" cy="74" r="10" fill="#b45309"/>
  <text x="160" y="78" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">1</text>
  <circle cx="112" cy="38" r="10" fill="#b45309"/>
  <text x="112" y="42" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">2</text>
  <circle cx="26" cy="82" r="10" fill="#b45309"/>
  <text x="26" y="86" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">3</text>
  <circle cx="612" cy="188" r="10" fill="#b45309"/>
  <text x="612" y="192" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">4</text>
  <circle cx="612" cy="274" r="10" fill="#b45309"/>
  <text x="612" y="278" font-size="11" text-anchor="middle" fill="#ffffff" font-weight="700">5</text>
  <rect x="20" y="316" width="600" height="62" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="32" y="335" font-size="9.8" fill="#1f2937">1 Editor: escreva o script   2 Raio: executa (Ctrl + Enter executa só o comando onde está o cursor)</text>
  <text x="32" y="351" font-size="9.8" fill="#1f2937">3 Painel SCHEMAS: confira o banco e as tabelas (clique no ícone de atualizar)   4 Resultado   5 Mensagem do banco</text>
  <text x="32" y="367" font-size="9.8" fill="#1f2937">Para executar o script inteiro (vários comandos), use Ctrl + Shift + Enter.</text>
