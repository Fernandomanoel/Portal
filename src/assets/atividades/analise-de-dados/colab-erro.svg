  <text x="34" y="296" font-size="12" fill="#1f2937" font-weight="700">Erro não é falha sua: é o computador explicando o que não entendeu.</text>
  <text x="34" y="316" font-size="11" fill="#1f2937">Leia sempre a ÚLTIMA linha: ela diz o tipo do erro e o nome que causou o problema.</text>
