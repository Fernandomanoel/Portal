<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#cbd5e1"/>
  <rect x="24" y="20" width="592" height="360" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-width="1"/>
  <rect x="24" y="20" width="592" height="28" rx="8" fill="#e2e8f0"/>
  <text x="40" y="39" font-size="12" fill="#1f2937" font-weight="700">MySQL Workbench</text>
  <text x="48" y="84" font-size="16" fill="#1f2937" font-weight="700">Welcome to MySQL Workbench</text>
  <text x="48" y="116" font-size="12" fill="#00758f" font-weight="700">MySQL Connections</text>
  <rect x="48" y="130" width="200" height="96" rx="8" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1"/>
  <text x="60" y="156" font-size="12" fill="#1f2937" font-weight="700">Local instance MySQL</text>
  <text x="60" y="176" font-size="10.5" fill="#6b7280">root</text>
  <text x="60" y="192" font-size="10.5" fill="#6b7280">localhost:3306</text>
  <rect x="44" y="126" width="208" height="104" rx="10" fill="none" stroke="#ffffff" stroke-width="10"/>
  <rect x="44" y="126" width="208" height="104" rx="10" fill="none" stroke="#ea580c" stroke-width="5"/>
  <rect x="270" y="130" width="200" height="96" rx="8" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="370" y="184" font-size="11" fill="#6b7280" text-anchor="middle">+  Nova conexão</text>
  <rect x="48" y="252" width="540" height="100" rx="8" fill="#fffbeb" stroke="#fcd34d" stroke-width="1"/>
  <text x="60" y="274" font-size="10.5" fill="#1f2937">1.  Antes, ligue o MySQL no XAMPP (Start na linha do MySQL).</text>
  <text x="60" y="294" font-size="10.5" fill="#1f2937">2.  Dê dois cliques no cartão «Local instance MySQL». Se pedir senha e você</text>
  <text x="60" y="310" font-size="10.5" fill="#1f2937">     não criou nenhuma, deixe em branco ou pergunte ao instrutor.</text>
  <text x="60" y="330" font-size="10.5" fill="#1f2937">3.  Se aparecer «Cannot connect», volte ao XAMPP: o MySQL provavelmente está parado.</text>
</svg>
