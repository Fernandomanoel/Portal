<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#dfe8f5"/>
  <rect width="640" height="400" fill="#dfe8f5"/>
  <g filter="url(#sombra)"><rect x="90" y="30" width="460" height="340" rx="8" fill="#f9fafb" stroke="#cbd5e1"/></g>
  <text x="104" y="50" font-size="11.5" fill="#1f2937">Atributos Avançados</text>
  <text x="532" y="51" font-size="12" fill="#4b5563">×</text>
  <text x="106" y="70" font-size="10.5" fill="#1f2937">Escolha as configurações desejada para esta pasta.</text>
  <text x="106" y="100" font-size="11" fill="#0b4a9e" font-weight="700">Atributos de arquivo e índice</text>
  <rect x="112" y="117" width="13" height="13" rx="2" fill="#0067c0"/>
  <path d="M115 123 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="1.8"/>
  <text x="132" y="128" font-size="10.5" fill="#1f2937">Os arquivos desta pasta estão prontos para arquivamento</text>
  <rect x="112" y="141" width="13" height="13" rx="2" fill="#0067c0"/>
  <path d="M115 147 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="1.8"/>
  <text x="132" y="152" font-size="10.5" fill="#1f2937">Permitir que o conteúdo dos arquivos seja indexado</text>
  <text x="106" y="190" font-size="11" fill="#0b4a9e" font-weight="700">Atributos de compactação ou criptografia</text>
  <rect x="106" y="205" width="350" height="22" rx="4" fill="#dbeafe" stroke="#60a5fa"/>
  <rect x="112" y="209" width="13" height="13" rx="2" fill="#0067c0"/>
  <path d="M115 215 l3 3 l5 -6" fill="none" stroke="#fff" stroke-width="1.8"/>
  <text x="132" y="220" font-size="10.5" fill="#0b4a9e" font-weight="700">Compactar conteúdo para economizar espaço em disco</text>
  <rect x="112" y="235" width="13" height="13" rx="2" fill="#fff" stroke="#6b7280"/>
  <text x="132" y="246" font-size="10.5" fill="#1f2937">Criptografar o conteúdo para proteger os dados</text>
  <rect x="380" y="330" width="74" height="24" rx="5" fill="#0067c0"/>
  <text x="417.0" y="346" font-size="10.5" fill="#ffffff" text-anchor="middle">OK</text>
  <rect x="462" y="330" width="76" height="24" rx="5" fill="#ffffff" stroke="#d1d5db"/>
  <text x="500.0" y="346" font-size="10.5" fill="#1f2937" text-anchor="middle">Cancelar</text>
  <rect x="106" y="270" width="262" height="48" rx="8" fill="#ffffff" stroke="#bfdbfe"/>
  <text x="118" y="290" font-size="11.5" font-weight="700" fill="#0b4a9e">Caminho</text>
  <text x="118" y="308" font-size="11" fill="#1f2937">Botão direito em Textos → Propriedades → Avançados</text>
