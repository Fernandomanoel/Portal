<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <linearGradient id="fundo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/>
      <stop offset="0.55" stop-color="#1d4ed8"/>
      <stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
    <radialGradient id="brilho" cx="0.72" cy="0.35" r="0.55">
      <stop offset="0" stop-color="#bfdbfe" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#bfdbfe" stop-opacity="0"/>
    </radialGradient>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0b1b44" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="640" height="400" fill="url(#fundo)"/>
  <rect width="640" height="400" fill="url(#brilho)"/>

  <!-- ícones da área de trabalho -->
  <g fill="#fff" font-size="10" text-anchor="middle" transform="translate(16 0)">
    <rect x="22" y="18" width="36" height="28" rx="3" fill="#e0ecff" stroke="#fff" stroke-width="1.5"/>
    <rect x="34" y="46" width="12" height="4" fill="#e0ecff"/>
    <rect x="28" y="50" width="24" height="3" rx="1.5" fill="#e0ecff"/>
    <text x="40" y="67">Este Computador</text>

    <path d="M29 84 h22 l-2 30 h-18 z" fill="#e0ecff" stroke="#fff" stroke-width="1.5"/>
    <rect x="26" y="80" width="28" height="4" rx="2" fill="#e0ecff"/>
    <text x="40" y="130">Lixeira</text>
  </g>

  <!-- cursor no ponto do clique -->
  <g transform="translate(262 118)">
    <path d="M0 0 L0 17 L4.5 13 L8 20 L11 18.5 L7.6 11.6 L13 11.6 Z" fill="#fff" stroke="#111" stroke-width="1"/>
  </g>

  <!-- menu de contexto -->
  <g filter="url(#sombra)">
    <rect x="276" y="126" width="238" height="214" rx="8" fill="#f9f9f9" stroke="#d4d4d8"/>
  </g>
  <g font-size="12.5" fill="#1f2937">
    <text x="300" y="152">Exibir</text>
    <text x="490" y="152" fill="#6b7280" text-anchor="end">›</text>
    <text x="300" y="178">Classificar por</text>
    <text x="490" y="178" fill="#6b7280" text-anchor="end">›</text>
    <text x="300" y="204">Atualizar</text>
    <line x1="288" y1="216" x2="502" y2="216" stroke="#e4e4e7"/>
    <text x="300" y="238">Novo</text>
    <text x="490" y="238" fill="#6b7280" text-anchor="end">›</text>
    <line x1="288" y1="250" x2="502" y2="250" stroke="#e4e4e7"/>
    <text x="300" y="272">Configurações de exibição</text>
    <rect x="284" y="283" width="222" height="28" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="300" y="302" font-weight="700" fill="#0b4a9e">Personalizar</text>
    <text x="300" y="330" fill="#6b7280">Mostrar mais opções</text>
  </g>

  <!-- chamada explicativa -->
  <g>
    <rect x="22" y="160" width="196" height="58" rx="8" fill="#ffffff" opacity="0.95"/>
    <text x="34" y="182" font-size="12" font-weight="700" fill="#0b4a9e">1. Botão direito</text>
    <text x="34" y="200" font-size="11.5" fill="#1f2937">em um espaço vazio da</text>
    <text x="34" y="214" font-size="11.5" fill="#1f2937">área de trabalho</text>
    <path d="M218 190 Q 245 170 262 128" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="5 4"/>
  </g>
  <g>
    <rect x="522" y="282" width="110" height="46" rx="8" fill="#ffffff" opacity="0.95"/>
    <text x="532" y="301" font-size="12" font-weight="700" fill="#0b4a9e">2. Clique em</text>
    <text x="532" y="318" font-size="11.5" fill="#1f2937">Personalizar</text>
  </g>

  <!-- barra de tarefas -->
  <rect x="0" y="366" width="640" height="34" fill="#eef2f7" opacity="0.92"/>
  <g transform="translate(256 373)">
    <rect x="0" y="0" width="20" height="20" rx="4" fill="#2563eb"/>
    <rect x="5" y="5" width="4" height="4" fill="#fff"/><rect x="11" y="5" width="4" height="4" fill="#fff"/>
    <rect x="5" y="11" width="4" height="4" fill="#fff"/><rect x="11" y="11" width="4" height="4" fill="#fff"/>
    <rect x="32" y="2" width="16" height="16" rx="8" fill="none" stroke="#374151" stroke-width="2"/>
    <rect x="60" y="3" width="18" height="14" rx="2" fill="#fbbf24"/>
    <rect x="90" y="2" width="16" height="16" rx="4" fill="#0ea5e9"/>
    <rect x="118" y="2" width="16" height="16" rx="4" fill="#10b981"/>
  </g>
  <text x="620" y="387" font-size="10.5" fill="#1f2937" text-anchor="end">10:30</text>
</svg>
