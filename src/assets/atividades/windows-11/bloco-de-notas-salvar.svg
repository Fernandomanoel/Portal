<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#dfe8f5"/>
  <g filter="url(#sombra)"><rect x="20" y="16" width="600" height="368" rx="10" fill="#ffffff" stroke="#cbd5e1"/></g>
  <path d="M20 26 a10 10 0 0 1 10 -10 h580 a10 10 0 0 1 10 10 v24 h-600 z" fill="#eef1f5"/>
  <text x="54" y="38" font-size="11.5" fill="#1f2937">texto1.txt - Bloco de Notas</text>
  <rect x="34" y="27" width="13" height="13" rx="3" fill="#60a5fa"/>
  <g fill="#4b5563" font-size="12"><text x="556" y="38">—</text><rect x="578" y="30" width="9" height="9" fill="none" stroke="#4b5563"/><text x="600" y="39">×</text></g>
  <g font-size="11.5">
    <rect x="26" y="54" width="65" height="22" rx="4" fill="#dbeafe"/>
    <text x="34" y="69" fill="#1f2937">Arquivo</text>
    <text x="105" y="69" fill="#1f2937">Editar</text>
    <text x="169" y="69" fill="#1f2937">Exibir</text>
  </g>
  <line x1="20" y1="80" x2="620" y2="80" stroke="#e5e7eb"/>
  <text x="42" y="272" font-size="12" fill="#1f2937">Esta é uma atividade de Windows.</text>
  <text x="42" y="292" font-size="12" fill="#1f2937">Estou aprendendo a criar pastas e organizar arquivos.</text>
  <rect x="357" y="280" width="1.5" height="15" fill="#1f2937"/>
  <g filter="url(#sombra)"><rect x="28" y="78" width="236" height="152" rx="8" fill="#f9f9f9" stroke="#d4d4d8"/></g>
  <g font-size="11.5" fill="#1f2937">
    <text x="44" y="101" fill="#1f2937">Nova guia</text>
    <text x="250" y="101" fill="#6b7280" text-anchor="end" font-size="10.5">Ctrl + N</text>
    <text x="44" y="127" fill="#1f2937">Abrir</text>
    <text x="250" y="127" fill="#6b7280" text-anchor="end" font-size="10.5">Ctrl + O</text>
    <rect x="34" y="137" width="224" height="24" rx="5" fill="#dbeafe" stroke="#60a5fa"/>
    <text x="44" y="153" fill="#0b4a9e" font-weight="700">Salvar</text>
    <text x="250" y="153" fill="#6b7280" text-anchor="end" font-size="10.5">Ctrl + S</text>
    <text x="44" y="179" fill="#1f2937">Salvar como</text>
    <text x="250" y="179" fill="#6b7280" text-anchor="end" font-size="10.5">Ctrl + Shift + S</text>
    <line x1="36" y1="193" x2="256" y2="193" stroke="#e4e4e7"/>
    <text x="44" y="215" fill="#1f2937">Sair</text>
  </g>
  <rect x="300" y="96" width="300" height="64" rx="8" fill="#0b4a9e"/>
  <text x="312" y="116" font-size="11.5" font-weight="700" fill="#ffffff">Salvar e fechar</text>
  <text x="312" y="134" font-size="11" fill="#dbeafe">Arquivo → Salvar (ou Ctrl + S)</text>
  <text x="312" y="150" font-size="11" fill="#dbeafe">e depois feche o Bloco de Notas.</text>
</svg>
