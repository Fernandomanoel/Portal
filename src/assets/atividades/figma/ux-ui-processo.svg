<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="34" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">O processo de design de interface</text>
  <rect x="26" y="90" width="104" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#sombra)"/>
  <circle cx="78" cy="120" r="18" fill="#0d99ff"/>
  <text x="78" y="126" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
  <text x="78" y="164" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Entender</text>
  <text x="78" y="188" font-size="10.5" fill="#6b7280" text-anchor="middle">quem usa e</text>
  <text x="78" y="204" font-size="10.5" fill="#6b7280" text-anchor="middle">o problema</text>
  <line x1="132" y1="165" x2="144" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="144,165 136.8,168.5 136.8,161.5" fill="#94a3b8"/>
  <rect x="146" y="90" width="104" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#sombra)"/>
  <circle cx="198" cy="120" r="18" fill="#0d99ff"/>
  <text x="198" y="126" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
  <text x="198" y="164" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Esboçar</text>
  <text x="198" y="188" font-size="10.5" fill="#6b7280" text-anchor="middle">wireframes</text>
  <text x="198" y="204" font-size="10.5" fill="#6b7280" text-anchor="middle">em preto e branco</text>
  <line x1="252" y1="165" x2="264" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="264,165 256.8,168.5 256.8,161.5" fill="#94a3b8"/>
  <rect x="266" y="90" width="104" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#sombra)"/>
  <circle cx="318" cy="120" r="18" fill="#7c3aed"/>
  <text x="318" y="126" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
  <text x="318" y="164" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Desenhar</text>
  <text x="318" y="188" font-size="10.5" fill="#6b7280" text-anchor="middle">cores, textos</text>
  <text x="318" y="204" font-size="10.5" fill="#6b7280" text-anchor="middle">e componentes (UI)</text>
  <line x1="372" y1="165" x2="384" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="384,165 376.8,168.5 376.8,161.5" fill="#94a3b8"/>
  <rect x="386" y="90" width="104" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#sombra)"/>
  <circle cx="438" cy="120" r="18" fill="#0d99ff"/>
  <text x="438" y="126" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
  <text x="438" y="164" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Prototipar</text>
  <text x="438" y="188" font-size="10.5" fill="#6b7280" text-anchor="middle">ligar as telas</text>
  <text x="438" y="204" font-size="10.5" fill="#6b7280" text-anchor="middle">e simular o uso</text>
  <line x1="492" y1="165" x2="504" y2="165" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="504,165 496.8,168.5 496.8,161.5" fill="#94a3b8"/>
  <rect x="506" y="90" width="104" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" filter="url(#sombra)"/>
  <circle cx="558" cy="120" r="18" fill="#0d99ff"/>
  <text x="558" y="126" font-size="16" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
  <text x="558" y="164" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Testar</text>
  <text x="558" y="188" font-size="10.5" fill="#6b7280" text-anchor="middle">observar e</text>
  <text x="558" y="204" font-size="10.5" fill="#6b7280" text-anchor="middle">melhorar (UX)</text>
  <path d="M570 252 V290 H78 V252" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="5 4"/>
  <line x1="78" y1="262" x2="78" y2="250" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="78,250 81.5,257.2 74.5,257.2" fill="#94a3b8"/>
  <text x="320" y="312" font-size="11.5" fill="#6b7280" text-anchor="middle">O resultado do teste volta para o começo: design é um ciclo, não uma linha reta.</text>
  <rect x="40" y="338" width="250" height="36" rx="8" fill="#dbeafe"/>
  <text x="165" y="360" font-size="11.5" fill="#1e3a8a" font-weight="700" text-anchor="middle">UX = como é usar (facilidade)</text>
  <rect x="350" y="338" width="250" height="36" rx="8" fill="#ede9fe"/>
  <text x="475" y="360" font-size="11.5" fill="#4c1d95" font-weight="700" text-anchor="middle">UI = como parece (visual)</text>
</svg>
