<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="34" font-size="14" fill="#1f2937" font-weight="700" text-anchor="middle">Um botão com Auto Layout cresce com o texto</text>
  <rect x="60" y="66" width="70" height="40" rx="8" fill="#7c3aed"/>
  <text x="95" y="91" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">OK</text>
  <rect x="60" y="66" width="16" height="40" rx="0" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="114" y="66" width="16" height="40" rx="0" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="144" y="91" font-size="10.5" fill="#6b7280">70 px de largura</text>
  <rect x="60" y="130" width="94" height="40" rx="8" fill="#7c3aed"/>
  <text x="107" y="155" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">Entrar</text>
  <rect x="60" y="130" width="16" height="40" rx="0" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="138" y="130" width="16" height="40" rx="0" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="168" y="155" font-size="10.5" fill="#6b7280">94 px de largura</text>
  <rect x="60" y="194" width="170" height="40" rx="8" fill="#7c3aed"/>
  <text x="145" y="219" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">Criar minha conta</text>
  <rect x="60" y="194" width="16" height="40" rx="0" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="3 2"/>
  <rect x="214" y="194" width="16" height="40" rx="0" fill="none" stroke="#ec4899" stroke-width="1" stroke-dasharray="3 2"/>
  <text x="244" y="219" font-size="10.5" fill="#6b7280">170 px de largura</text>
  <rect x="380" y="66" width="230" height="168" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <text x="396" y="90" font-size="11.5" fill="#1f2937" font-weight="700">Painel Auto Layout</text>
  <text x="396" y="114" font-size="10.5" fill="#6b7280">Direção        →  horizontal</text>
  <text x="396" y="134" font-size="10.5" fill="#be185d" font-weight="700">Preenchimento  16  (lados)</text>
  <text x="396" y="154" font-size="10.5" fill="#be185d" font-weight="700">Preenchimento  10  (cima/baixo)</text>
  <text x="396" y="174" font-size="10.5" fill="#6b7280">Espaçamento   8   (entre itens)</text>
  <text x="396" y="194" font-size="10.5" fill="#6b7280">Tamanho  Hug contents</text>
  <text x="396" y="216" font-size="9" fill="#6b7280">Atalho: Shift + A</text>
  <rect x="30" y="270" width="580" height="100" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="320" y="296" font-size="12" fill="#7c2d12" font-weight="700" text-anchor="middle">As linhas rosa tracejadas são o preenchimento (padding): 16 px nos lados.</text>
  <text x="320" y="318" font-size="11.5" fill="#7c2d12" text-anchor="middle">Mudou o texto? O botão se ajusta sozinho — sem arrastar alça, sem recalcular.</text>
  <text x="320" y="340" font-size="11.5" fill="#7c2d12" text-anchor="middle">Hug contents = "abraçar o conteúdo".  Fill container = "preencher o espaço do pai".</text>
</svg>
