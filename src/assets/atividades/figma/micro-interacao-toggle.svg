<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="34" font-size="14" fill="#1f2937" font-weight="700" text-anchor="middle">Micro-interação: o botão liga/desliga</text>
  <rect x="40" y="60" width="250" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="350" y="60" width="250" height="150" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <rect x="120" y="94" width="90" height="48" rx="24" fill="#cbd5e1"/>
  <circle cx="144" cy="118" r="18" fill="#ffffff"/>
  <text x="165" y="172" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">Desligado</text>
  <rect x="430" y="94" width="90" height="48" rx="24" fill="#16a34a"/>
  <circle cx="496" cy="118" r="18" fill="#ffffff"/>
  <text x="475" y="172" font-size="12" fill="#1f2937" font-weight="700" text-anchor="middle">Ligado</text>
  <line x1="300" y1="135" x2="340" y2="135" stroke="#0d99ff" stroke-width="3"/>
  <polygon points="340,135 332.8,138.5 332.8,131.5" fill="#0d99ff"/>
  <text x="320" y="118" font-size="9.5" fill="#0d99ff" font-weight="700" text-anchor="middle">ao clicar</text>
  <line x1="340" y1="160" x2="300" y2="160" stroke="#94a3b8" stroke-width="2"/>
  <polygon points="300,160 307.2,156.5 307.2,163.5" fill="#94a3b8"/>
  <text x="320" y="176" font-size="9.5" fill="#6b7280" text-anchor="middle">ao clicar</text>
  <rect x="40" y="230" width="560" height="140" rx="12" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="60" y="256" font-size="12.5" fill="#1e3a8a" font-weight="700">Como montar</text>
  <text x="60" y="280" font-size="11" fill="#1e3a8a">1. Componente com duas variantes: Estado = Desligado e Estado = Ligado.</text>
  <text x="60" y="300" font-size="11" fill="#1e3a8a">2. A bolinha tem o MESMO nome nas duas variantes (assim o Smart animate a move).</text>
  <text x="60" y="320" font-size="11" fill="#1e3a8a">3. Protótipo: Desligado → Ao clicar → Mudar para Ligado (e o contrário), Smart animate, 200 ms.</text>
  <text x="60" y="346" font-size="11" fill="#1e3a8a" font-weight="700">O Figma interpola a posição da bolinha e a cor do fundo sozinho.</text>
</svg>
