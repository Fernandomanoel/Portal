<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="34" font-size="14" fill="#1f2937" font-weight="700" text-anchor="middle">Curvas de animação: como o movimento acelera</text>
  <rect x="28" y="56" width="138" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="47" y1="80" x2="47" y2="160" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="47" y1="160" x2="147" y2="160" stroke="#e5e7eb" stroke-width="1"/>
  <g transform="translate(47 80)"><path d="M0 80 L100 0" transform="translate(0 0)" fill="none" stroke="#94a3b8" stroke-width="3" stroke-linecap="round"/></g>
  <text x="97" y="188" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Linear</text>
  <text x="97" y="208" font-size="9.5" fill="#6b7280" text-anchor="middle">mecânica, sem vida</text>
  <text x="152" y="100" font-size="8" fill="#6b7280" text-anchor="middle">fim</text>
  <text x="47" y="176" font-size="8" fill="#6b7280">tempo →</text>
  <rect x="178" y="56" width="138" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="197" y1="80" x2="197" y2="160" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="197" y1="160" x2="297" y2="160" stroke="#e5e7eb" stroke-width="1"/>
  <g transform="translate(197 80)"><path d="M0 80 C60 80 80 40 100 0" transform="translate(0 0)" fill="none" stroke="#f97316" stroke-width="3" stroke-linecap="round"/></g>
  <text x="247" y="188" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Ease in</text>
  <text x="247" y="208" font-size="9.5" fill="#6b7280" text-anchor="middle">saída de cena</text>
  <text x="302" y="100" font-size="8" fill="#6b7280" text-anchor="middle">fim</text>
  <text x="197" y="176" font-size="8" fill="#6b7280">tempo →</text>
  <rect x="328" y="56" width="138" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="347" y1="80" x2="347" y2="160" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="347" y1="160" x2="447" y2="160" stroke="#e5e7eb" stroke-width="1"/>
  <g transform="translate(347 80)"><path d="M0 80 C20 40 40 0 100 0" transform="translate(0 0)" fill="none" stroke="#16a34a" stroke-width="3" stroke-linecap="round"/></g>
  <text x="397" y="188" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Ease out</text>
  <text x="397" y="208" font-size="9.5" fill="#6b7280" text-anchor="middle">entrada: o mais usado</text>
  <text x="452" y="100" font-size="8" fill="#6b7280" text-anchor="middle">fim</text>
  <text x="347" y="176" font-size="8" fill="#6b7280">tempo →</text>
  <rect x="478" y="56" width="138" height="180" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <line x1="497" y1="80" x2="497" y2="160" stroke="#e5e7eb" stroke-width="1"/>
  <line x1="497" y1="160" x2="597" y2="160" stroke="#e5e7eb" stroke-width="1"/>
  <g transform="translate(497 80)"><path d="M0 80 C30 -20 50 20 65 0 S85 6 100 0" transform="translate(0 0)" fill="none" stroke="#7c3aed" stroke-width="3" stroke-linecap="round"/></g>
  <text x="547" y="188" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Spring</text>
  <text x="547" y="208" font-size="9.5" fill="#6b7280" text-anchor="middle">quica: toque divertido</text>
  <text x="602" y="100" font-size="8" fill="#6b7280" text-anchor="middle">fim</text>
  <text x="497" y="176" font-size="8" fill="#6b7280">tempo →</text>
  <rect x="28" y="256" width="584" height="112" rx="12" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="44" y="282" font-size="12.5" fill="#7c2d12" font-weight="700">Quanto dura?</text>
  <text x="44" y="304" font-size="11" fill="#7c2d12">Botão e troca de estado: 100–200 ms.  Menus e janelinhas: 200–300 ms.  Troca de tela: 300–500 ms.</text>
  <text x="44" y="326" font-size="11" fill="#7c2d12">Mais que 500 ms cansa; menos que 100 ms ninguém percebe.</text>
  <text x="44" y="352" font-size="11.5" fill="#7c2d12" font-weight="700">Regra de ouro: a animação ajuda a entender o que mudou — não é enfeite.</text>
</svg>
