<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="14" fill="#1f2937" font-weight="700" text-anchor="middle">Variantes: um componente, várias versões</text>
  <rect x="40" y="50" width="560" height="210" rx="10" fill="#ffffff" stroke="#7c3aed" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="175" y="78" font-size="11" fill="#6b7280" font-weight="700" text-anchor="middle">Padrão</text>
  <text x="350" y="78" font-size="11" fill="#6b7280" font-weight="700" text-anchor="middle">Hover (mouse em cima)</text>
  <text x="525" y="78" font-size="11" fill="#6b7280" font-weight="700" text-anchor="middle">Desabilitado</text>
  <text x="54" y="134" font-size="11" fill="#6b7280" font-weight="700">Pequeno</text>
  <rect x="130" y="110" width="90" height="28" rx="8" fill="#7c3aed"/>
  <text x="175" y="127.6" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Entrar</text>
  <rect x="305" y="110" width="90" height="28" rx="8" fill="#5b21b6"/>
  <text x="350" y="127.6" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Entrar</text>
  <rect x="480" y="110" width="90" height="28" rx="8" fill="#d1d5db"/>
  <text x="525" y="127.6" font-size="10" fill="#9ca3af" font-weight="700" text-anchor="middle">Entrar</text>
  <text x="54" y="204" font-size="11" fill="#6b7280" font-weight="700">Grande</text>
  <rect x="110" y="180" width="130" height="40" rx="8" fill="#7c3aed"/>
  <text x="175" y="204.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Entrar</text>
  <rect x="285" y="180" width="130" height="40" rx="8" fill="#5b21b6"/>
  <text x="350" y="204.32" font-size="12" fill="#ffffff" font-weight="700" text-anchor="middle">Entrar</text>
  <rect x="460" y="180" width="130" height="40" rx="8" fill="#d1d5db"/>
  <text x="525" y="204.32" font-size="12" fill="#9ca3af" font-weight="700" text-anchor="middle">Entrar</text>
  <rect x="40" y="280" width="270" height="92" rx="10" fill="#eff6ff" stroke="#93c5fd" stroke-width="1"/>
  <text x="54" y="304" font-size="11.5" fill="#1e3a8a" font-weight="700">Propriedades da variante</text>
  <text x="54" y="324" font-size="10.5" fill="#1e3a8a">Estado   = Padrão | Hover | Desabilitado</text>
  <text x="54" y="342" font-size="10.5" fill="#1e3a8a">Tamanho  = Pequeno | Grande</text>
  <rect x="330" y="280" width="270" height="92" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="344" y="304" font-size="11.5" fill="#7c2d12" font-weight="700">Para usar</text>
  <text x="344" y="324" font-size="10.5" fill="#7c2d12">Arraste uma instância e escolha</text>
  <text x="344" y="342" font-size="10.5" fill="#7c2d12">Estado e Tamanho no painel Design.</text>
</svg>
