<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <text x="320" y="32" font-size="14" fill="#1f2937" font-weight="700" text-anchor="middle">Mudou o principal? As cópias acompanham</text>
  <text x="160" y="66" font-size="11.5" fill="#6b7280" text-anchor="middle">Antes: tudo roxo</text>
  <text x="480" y="66" font-size="11.5" fill="#6b7280" text-anchor="middle">Depois: principal ficou verde</text>
  <rect x="40" y="80" width="240" height="190" rx="10" fill="#e5e5e5"/>
  <rect x="60" y="96" width="120" height="34" rx="0" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <path d="M60 96 l-3 -8 h50 v8" fill="#7c3aed"/>
  <rect x="62" y="98" width="116" height="30" rx="8" fill="#7c3aed"/>
  <text x="120" y="116.6" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Principal</text>
  <text x="196" y="118" font-size="10" fill="#7c3aed" font-weight="700">◆ componente</text>
  <rect x="62" y="150" width="116" height="28" rx="8" fill="#7c3aed"/>
  <text x="120" y="167.6" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Cópia 1</text>
  <text x="196" y="168" font-size="10" fill="#6b7280">◇ instância</text>
  <rect x="62" y="186" width="116" height="28" rx="8" fill="#7c3aed"/>
  <text x="120" y="203.6" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Cópia 2</text>
  <text x="196" y="204" font-size="10" fill="#6b7280">◇ instância</text>
  <rect x="62" y="222" width="116" height="28" rx="8" fill="#7c3aed"/>
  <text x="120" y="239.6" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Cópia 3</text>
  <text x="196" y="240" font-size="10" fill="#6b7280">◇ instância</text>
  <rect x="360" y="80" width="240" height="190" rx="10" fill="#e5e5e5"/>
  <rect x="380" y="96" width="120" height="34" rx="0" fill="none" stroke="#7c3aed" stroke-width="2"/>
  <path d="M380 96 l-3 -8 h50 v8" fill="#7c3aed"/>
  <rect x="382" y="98" width="116" height="30" rx="8" fill="#16a34a"/>
  <text x="440" y="116.6" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Principal</text>
  <text x="516" y="118" font-size="10" fill="#7c3aed" font-weight="700">◆ componente</text>
  <rect x="382" y="150" width="116" height="28" rx="8" fill="#16a34a"/>
  <text x="440" y="167.6" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Cópia 1</text>
  <text x="516" y="168" font-size="10" fill="#6b7280">◇ instância</text>
  <rect x="382" y="186" width="116" height="28" rx="8" fill="#16a34a"/>
  <text x="440" y="203.6" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Cópia 2</text>
  <text x="516" y="204" font-size="10" fill="#6b7280">◇ instância</text>
  <rect x="382" y="222" width="116" height="28" rx="8" fill="#16a34a"/>
  <text x="440" y="239.6" font-size="10" fill="#ffffff" font-weight="700" text-anchor="middle">Cópia 3</text>
  <text x="516" y="240" font-size="10" fill="#6b7280">◇ instância</text>
  <text x="320" y="176" font-size="32" fill="#0d99ff" text-anchor="middle">→</text>
  <rect x="30" y="290" width="580" height="84" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="320" y="316" font-size="11.5" fill="#7c2d12" font-weight="700" text-anchor="middle">Instância = cópia ligada ao principal (losango vazado ◇). Principal = losango cheio ◆.</text>
  <text x="320" y="338" font-size="11.5" fill="#7c2d12" text-anchor="middle">Alterações no principal valem para todas as instâncias.</text>
  <text x="320" y="358" font-size="11.5" fill="#7c2d12" text-anchor="middle">Na instância você ainda pode trocar só o texto — sem quebrar o vínculo.</text>
</svg>
