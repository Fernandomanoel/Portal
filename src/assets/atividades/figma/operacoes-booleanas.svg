<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#eef2f7"/>
  <defs>
    <mask id="semB"><rect width="640" height="400" fill="#fff"/><circle cx="0" cy="0" r="30" fill="#000"/></mask>
  </defs>
  <text x="320" y="34" font-size="14" fill="#1f2937" font-weight="700" text-anchor="middle">Operações booleanas: formas novas a partir de formas simples</text>
  <rect x="30" y="60" width="140" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <defs><clipPath id="b0"><circle cx="108" cy="130" r="32"/></clipPath><mask id="m0"><rect x="30" y="60" width="140" height="190" fill="#fff"/><circle cx="108" cy="130" r="32" fill="#000"/></mask><mask id="n0"><rect x="30" y="60" width="140" height="190" fill="#fff"/><circle cx="82" cy="130" r="32" fill="#000"/></mask></defs>
  <circle cx="82" cy="130" r="32" fill="#7c3aed"/>
  <circle cx="108" cy="130" r="32" fill="#7c3aed"/>
  <text x="100" y="196" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">União</text>
  <text x="100" y="214" font-size="9.5" fill="#6b7280" text-anchor="middle">une as formas</text>
  <text x="100" y="228" font-size="9.5" fill="#6b7280" text-anchor="middle">em uma</text>
  <rect x="180" y="60" width="140" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <defs><clipPath id="b1"><circle cx="258" cy="130" r="32"/></clipPath><mask id="m1"><rect x="180" y="60" width="140" height="190" fill="#fff"/><circle cx="258" cy="130" r="32" fill="#000"/></mask><mask id="n1"><rect x="180" y="60" width="140" height="190" fill="#fff"/><circle cx="232" cy="130" r="32" fill="#000"/></mask></defs>
  <circle cx="232" cy="130" r="32" fill="#7c3aed" mask="url(#m1)"/>
  <text x="250" y="196" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Subtração</text>
  <text x="250" y="214" font-size="9.5" fill="#6b7280" text-anchor="middle">a de cima</text>
  <text x="250" y="228" font-size="9.5" fill="#6b7280" text-anchor="middle">recorta a de baixo</text>
  <rect x="330" y="60" width="140" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <defs><clipPath id="b2"><circle cx="408" cy="130" r="32"/></clipPath><mask id="m2"><rect x="330" y="60" width="140" height="190" fill="#fff"/><circle cx="408" cy="130" r="32" fill="#000"/></mask><mask id="n2"><rect x="330" y="60" width="140" height="190" fill="#fff"/><circle cx="382" cy="130" r="32" fill="#000"/></mask></defs>
  <circle cx="382" cy="130" r="32" fill="#7c3aed" clip-path="url(#b2)"/>
  <text x="400" y="196" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Interseção</text>
  <text x="400" y="214" font-size="9.5" fill="#6b7280" text-anchor="middle">só o que</text>
  <text x="400" y="228" font-size="9.5" fill="#6b7280" text-anchor="middle">as duas têm em comum</text>
  <rect x="480" y="60" width="140" height="190" rx="12" fill="#ffffff" stroke="#cbd5e1" stroke-width="1"/>
  <defs><clipPath id="b3"><circle cx="558" cy="130" r="32"/></clipPath><mask id="m3"><rect x="480" y="60" width="140" height="190" fill="#fff"/><circle cx="558" cy="130" r="32" fill="#000"/></mask><mask id="n3"><rect x="480" y="60" width="140" height="190" fill="#fff"/><circle cx="532" cy="130" r="32" fill="#000"/></mask></defs>
  <circle cx="532" cy="130" r="32" fill="#7c3aed" mask="url(#m3)"/>
  <circle cx="558" cy="130" r="32" fill="#7c3aed" mask="url(#n3)"/>
  <text x="550" y="196" font-size="13" fill="#1f2937" font-weight="700" text-anchor="middle">Exclusão</text>
  <text x="550" y="214" font-size="9.5" fill="#6b7280" text-anchor="middle">tudo, menos a</text>
  <text x="550" y="228" font-size="9.5" fill="#6b7280" text-anchor="middle">parte comum</text>
  <rect x="30" y="270" width="580" height="100" rx="10" fill="#fff7ed" stroke="#fdba74" stroke-width="1"/>
  <text x="320" y="296" font-size="12" fill="#7c2d12" font-weight="700" text-anchor="middle">Selecione duas formas e use o menu da barra superior (ícone de formas booleanas).</text>
  <text x="320" y="318" font-size="11.5" fill="#7c2d12" text-anchor="middle">Ex.: casa = quadrado (união) + triângulo; engrenagem = círculo (subtração) com furo no meio.</text>
  <text x="320" y="340" font-size="11.5" fill="#7c2d12" text-anchor="middle">Depois use Flatten (Ctrl + E) para virar um único vetor, pronto para exportar.</text>
</svg>
