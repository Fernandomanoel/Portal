<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#e5e7eb"/>
  <rect x="14" y="10" width="612" height="380" rx="10" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="320" y="38" font-size="13.5" fill="#1f2937" font-weight="700" text-anchor="middle">Estrutura de um e-mail administrativo (molde de 7 blocos)</text>
  <rect x="26" y="52" width="112" height="38" rx="6" fill="#0f6cbd"/>
  <text x="82" y="76" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">1 Assunto</text>
  <rect x="144" y="52" width="466" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="156" y="68" font-size="10.5" fill="#1f2937" font-weight="700">Diz o assunto e a ação esperada</text>
  <text x="156" y="83" font-size="9.5" fill="#6b7280">Solicitação de orçamento — material de escritório (resposta até 12/03)</text>
  <rect x="26" y="96" width="112" height="38" rx="6" fill="#0891b2"/>
  <text x="82" y="120" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">2 Saudação</text>
  <rect x="144" y="96" width="466" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="156" y="112" font-size="10.5" fill="#1f2937" font-weight="700">Cumprimento + nome de quem recebe</text>
  <text x="156" y="127" font-size="9.5" fill="#6b7280">Prezada Joana,   ·   Bom dia, Sr. Roberto,</text>
  <rect x="26" y="140" width="112" height="38" rx="6" fill="#7c3aed"/>
  <text x="82" y="164" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">3 Contexto</text>
  <rect x="144" y="140" width="466" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="156" y="156" font-size="10.5" fill="#1f2937" font-weight="700">Uma frase: por que você escreve</text>
  <text x="156" y="171" font-size="9.5" fill="#6b7280">Escrevo em nome do setor administrativo da Empresa Alfa.</text>
  <rect x="26" y="184" width="112" height="38" rx="6" fill="#c2410c"/>
  <text x="82" y="208" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">4 Pedido</text>
  <rect x="144" y="184" width="466" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="156" y="200" font-size="10.5" fill="#1f2937" font-weight="700">O que você precisa, de forma direta</text>
  <text x="156" y="215" font-size="9.5" fill="#6b7280">Gostaríamos de receber orçamento de 50 resmas de papel A4.</text>
  <rect x="26" y="228" width="112" height="38" rx="6" fill="#b91c1c"/>
  <text x="82" y="252" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">5 Prazo</text>
  <rect x="144" y="228" width="466" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="156" y="244" font-size="10.5" fill="#1f2937" font-weight="700">Data ou prazo da resposta/ação</text>
  <text x="156" y="259" font-size="9.5" fill="#6b7280">Pedimos o retorno até quinta-feira, dia 12, às 17h.</text>
  <rect x="26" y="272" width="112" height="38" rx="6" fill="#15803d"/>
  <text x="82" y="296" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">6 Encerramento</text>
  <rect x="144" y="272" width="466" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="156" y="288" font-size="10.5" fill="#1f2937" font-weight="700">Agradecimento e despedida formal</text>
  <text x="156" y="303" font-size="9.5" fill="#6b7280">Agradeço a atenção.   Atenciosamente,</text>
  <rect x="26" y="316" width="112" height="38" rx="6" fill="#374151"/>
  <text x="82" y="340" font-size="11" fill="#ffffff" font-weight="700" text-anchor="middle">7 Assinatura</text>
  <rect x="144" y="316" width="466" height="38" rx="6" fill="#ffffff" stroke="#d1d5db"/>
  <text x="156" y="332" font-size="10.5" fill="#1f2937" font-weight="700">Nome, cargo, empresa e contato</text>
  <text x="156" y="347" font-size="9.5" fill="#6b7280">Marcos Oliveira · Assistente Administrativo · (92) 90000-0000</text>
  <text x="320" y="380" font-size="10" fill="#6b7280" text-anchor="middle">Um e-mail por assunto, em poucas linhas, sem letras maiúsculas o tempo todo e sem gírias.</text>
</svg>
