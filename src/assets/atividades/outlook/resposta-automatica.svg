  <text x="332" y="258" font-size="10.5" fill="#0f6cbd">joana.mendes@empresaalfa.com.br</text>
  <text x="332" y="284" font-size="10.5" fill="#1f2937">Atenciosamente,</text>
  <text x="332" y="300" font-size="10.5" fill="#1f2937" font-weight="700">Marcos Oliveira</text>
