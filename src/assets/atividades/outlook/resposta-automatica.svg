  <text x="155.6" y="316" font-size="10.5" fill="#1f2937" text-anchor="middle">Descartar</text>
  <rect x="40" y="336" width="270" height="38" rx="6" fill="#fffbeb" stroke="#fcd34d"/>
  <text x="50" y="352" font-size="9.5" fill="#92400e">Boa prática: diga até quando, quem substitui</text>
  <text x="50" y="366" font-size="9.5" fill="#92400e">e dê um contato para urgências.</text>
