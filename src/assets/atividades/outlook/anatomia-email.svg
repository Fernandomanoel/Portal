  <rect x="66" y="176" width="300" height="24" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="74" y="192" font-size="10.5" fill="#1f2937">Relatório de vendas de fevereiro — para aprovação</text>
