  <text x="36" y="228" font-size="10.5" fill="#1f2937">Prezada Joana,</text>
  <text x="36" y="246" font-size="10.5" fill="#1f2937">Segue em anexo o relatório de vendas de fevereiro.</text>
  <text x="36" y="262" font-size="10.5" fill="#1f2937">Peço sua aprovação até sexta-feira, dia 07.</text>
