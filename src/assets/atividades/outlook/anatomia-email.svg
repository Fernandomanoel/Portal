  <text x="413" y="94" font-size="9.5" fill="#1f2937">Um ou mais destinatários.</text>
  <line x1="366" y1="128" x2="400" y2="134" stroke="#0f6cbd" stroke-width="1.6"/><circle cx="366" cy="128" r="3" fill="#0f6cbd"/>
  <rect x="404" y="108" width="168" height="52" rx="6" fill="#ffffff" stroke="#0f6cbd"/>
  <text x="413" y="123" font-size="10.5" fill="#0f6cbd" font-weight="700">Cc (cópia)</text>
  <text x="413" y="137" font-size="9.5" fill="#1f2937">Quem precisa estar ciente.</text>
  <text x="413" y="150" font-size="9.5" fill="#1f2937">Todos veem o endereço.</text>
  <line x1="366" y1="158" x2="400" y2="190" stroke="#0f6cbd" stroke-width="1.6"/><circle cx="366" cy="158" r="3" fill="#0f6cbd"/>
  <rect x="404" y="164" width="168" height="52" rx="6" fill="#ffffff" stroke="#0f6cbd"/>
  <text x="413" y="179" font-size="10.5" fill="#0f6cbd" font-weight="700">Cco (cópia oculta)</text>
  <text x="413" y="193" font-size="9.5" fill="#1f2937">Ninguém vê os endereços.</text>
  <text x="413" y="206" font-size="9.5" fill="#1f2937">Use em listas e avisos.</text>
  <line x1="366" y1="188" x2="400" y2="246" stroke="#0f6cbd" stroke-width="1.6"/><circle cx="366" cy="188" r="3" fill="#0f6cbd"/>
  <rect x="404" y="220" width="168" height="52" rx="6" fill="#ffffff" stroke="#0f6cbd"/>
  <text x="413" y="235" font-size="10.5" fill="#0f6cbd" font-weight="700">Assunto</text>
  <text x="413" y="249" font-size="9.5" fill="#1f2937">Curto e específico: diz o</text>
  <text x="413" y="262" font-size="9.5" fill="#1f2937">que é e o que se espera.</text>
  <line x1="230" y1="313" x2="400" y2="302" stroke="#16a34a" stroke-width="1.6"/><circle cx="230" cy="313" r="3" fill="#16a34a"/>
  <rect x="404" y="276" width="168" height="52" rx="6" fill="#ffffff" stroke="#16a34a"/>
  <text x="413" y="291" font-size="10.5" fill="#16a34a" font-weight="700">Assinatura</text>
  <text x="413" y="305" font-size="9.5" fill="#1f2937">Nome, cargo e contato,</text>
  <text x="413" y="318" font-size="9.5" fill="#1f2937">sempre no mesmo padrão.</text>
  <line x1="216" y1="359" x2="400" y2="358" stroke="#16a34a" stroke-width="1.6"/><circle cx="216" cy="359" r="3" fill="#16a34a"/>
