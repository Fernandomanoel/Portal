<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#e5e7eb"/>
  <rect x="20" y="20" width="600" height="360" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="320" y="52" font-size="16" fill="#1f2937" font-weight="700" text-anchor="middle">Anatomia de um elemento HTML</text>
  <rect x="40" y="78" width="560" height="56" rx="8" fill="#0f172a"/>
  <text x="60" y="114" font-size="20" font-family="Consolas, Menlo, monospace" xml:space="preserve"><tspan fill="#fca5a5">&lt;p</tspan> <tspan fill="#fcd34d">class</tspan><tspan fill="#e5e7eb">=</tspan><tspan fill="#86efac">"aviso"</tspan><tspan fill="#fca5a5">&gt;</tspan><tspan fill="#ffffff">Atenção ao prazo!</tspan><tspan fill="#fca5a5">&lt;/p&gt;</tspan></text>
  <path d="M62 142 v6 h200.67999999999995 v-6" fill="none" stroke="#e34c26" stroke-width="2"/>
  <text x="162.33999999999997" y="164" font-size="11.5" fill="#e34c26" font-weight="700" text-anchor="middle">tag de abertura</text>
  <path d="M266.67999999999995 142 v6 h200.68 v-6" fill="none" stroke="#1d4ed8" stroke-width="2"/>
  <text x="367.02" y="164" font-size="11.5" fill="#1d4ed8" font-weight="700" text-anchor="middle">conteúdo</text>
  <text x="367.02" y="178" font-size="11.5" fill="#1d4ed8" font-weight="700" text-anchor="middle">(aparece na tela)</text>
  <path d="M471.35999999999996 142 v6 h44.160000000000025 v-6" fill="none" stroke="#e34c26" stroke-width="2"/>
  <text x="493.43999999999994" y="164" font-size="11.5" fill="#e34c26" font-weight="700" text-anchor="middle">tag de</text>
  <text x="493.43999999999994" y="178" font-size="11.5" fill="#e34c26" font-weight="700" text-anchor="middle">fechamento</text>
  <path d="M98.12 190 v6 h56.19999999999999 v-6" fill="none" stroke="#b45309" stroke-width="2"/>
  <text x="126.22" y="212" font-size="11.5" fill="#b45309" font-weight="700" text-anchor="middle">nome do</text>
  <text x="126.22" y="226" font-size="11.5" fill="#b45309" font-weight="700" text-anchor="middle">atributo</text>
  <path d="M170.35999999999999 190 v6 h80.28 v-6" fill="none" stroke="#15803d" stroke-width="2"/>
  <text x="210.5" y="212" font-size="11.5" fill="#15803d" font-weight="700" text-anchor="middle">valor do</text>
  <text x="210.5" y="226" font-size="11.5" fill="#15803d" font-weight="700" text-anchor="middle">atributo</text>
  <rect x="40" y="244" width="560" height="124" rx="8" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="56" y="266" font-size="12.5" fill="#1f2937" font-weight="700">Como ler:</text>
  <text x="56" y="288" font-size="10.5" fill="#1f2937">•  A tag abre com &lt; &gt; e fecha com &lt;/ &gt;: o navegador sabe onde o elemento começa e termina.</text>
  <text x="56" y="308" font-size="10.5" fill="#1f2937">•  O atributo dá uma informação extra à tag (aqui, a classe "aviso") e fica na tag de abertura.</text>
  <text x="56" y="328" font-size="10.5" fill="#1f2937">•  O conteúdo é o texto, a imagem ou outros elementos que ficam dentro da tag.</text>
  <text x="56" y="348" font-size="10.5" fill="#1f2937">•  Algumas tags não fecham, como &lt;img&gt; e &lt;br&gt;: são as tags vazias.</text>
</svg>
