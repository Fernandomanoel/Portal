<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" font-family="Segoe UI, system-ui, -apple-system, sans-serif">
  <defs>
    <filter id="sombra" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
    <linearGradient id="fundoDesktop" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f2a6b"/><stop offset="0.55" stop-color="#1d4ed8"/><stop offset="1" stop-color="#60a5fa"/>
    </linearGradient>
  </defs>
  <rect width="640" height="400" fill="#e5e7eb"/>
  <rect x="14" y="10" width="612" height="380" rx="12" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="320" y="36" font-size="15" fill="#1f2937" font-weight="700" text-anchor="middle">A estrutura de uma página HTML</text>
  <rect x="40" y="50" width="560" height="34" rx="6" fill="#fff7ed" stroke="#e34c26"/>
  <text text-anchor="middle" x="320" y="71" font-size="12" fill="#e34c26" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">&lt;html lang="pt-BR"&gt;</text>

  <rect x="56" y="96" width="150" height="270" rx="6" fill="#eff6ff" stroke="#1d4ed8"/>
  <text text-anchor="middle" x="131" y="114" font-size="12" fill="#1d4ed8" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">&lt;head&gt;</text>
  <text x="131" y="128" font-size="9.5" fill="#6b7280" text-anchor="middle">não aparece na página</text>
  <rect x="70" y="150" width="122" height="28" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
  <text text-anchor="middle" x="131" y="168" font-size="12" fill="#1d4ed8" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">&lt;meta charset&gt;</text>

  <rect x="70" y="188" width="122" height="28" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
  <text text-anchor="middle" x="131" y="206" font-size="12" fill="#1d4ed8" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">&lt;title&gt;</text>

  <rect x="70" y="226" width="122" height="28" rx="6" fill="#ffffff" stroke="#1d4ed8"/>
  <text text-anchor="middle" x="131" y="244" font-size="12" fill="#1d4ed8" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">&lt;link css&gt;</text>

  <text x="131" y="290" font-size="10" fill="#6b7280" text-anchor="middle">Informações para o</text>
  <text x="131" y="304" font-size="10" fill="#6b7280" text-anchor="middle">navegador: acentos,</text>
  <text x="131" y="318" font-size="10" fill="#6b7280" text-anchor="middle">título da aba, estilos.</text>
  <rect x="220" y="96" width="366" height="270" rx="6" fill="#f0fdf4" stroke="#15803d"/>
  <text text-anchor="middle" x="403" y="114" font-size="12" fill="#15803d" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">&lt;body&gt;</text>
  <text x="403" y="128" font-size="9.5" fill="#6b7280" text-anchor="middle">tudo o que aparece na página</text>
  <rect x="236" y="146" width="334" height="32" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text text-anchor="middle" x="403" y="166" font-size="12" fill="#15803d" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">&lt;header&gt;  cabeçalho com &lt;h1&gt; e &lt;nav&gt;</text>

  <rect x="236" y="188" width="334" height="84" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text text-anchor="middle" x="403" y="206" font-size="12" fill="#15803d" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">&lt;main&gt;</text>

  <rect x="250" y="214" width="150" height="44" rx="6" fill="#f0fdf4" stroke="#15803d"/>
  <text text-anchor="middle" x="325" y="234" font-size="12" fill="#15803d" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">&lt;section&gt;</text>
  <text x="325" y="249" font-size="9.5" fill="#6b7280" text-anchor="middle">h2 + p</text>
  <rect x="408" y="214" width="150" height="44" rx="6" fill="#f0fdf4" stroke="#15803d"/>
  <text text-anchor="middle" x="483" y="234" font-size="12" fill="#15803d" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">&lt;article&gt;</text>
  <text x="483" y="249" font-size="9.5" fill="#6b7280" text-anchor="middle">conteúdo independente</text>
  <rect x="236" y="282" width="334" height="32" rx="6" fill="#ffffff" stroke="#15803d"/>
  <text text-anchor="middle" x="403" y="302" font-size="12" fill="#15803d" font-family="Consolas, Menlo, monospace" font-weight="700" xml:space="preserve">&lt;footer&gt;  rodapé com contato</text>

  <text x="403" y="340" font-size="10.5" fill="#6b7280" text-anchor="middle">Cada bloco tem uma tag de abertura e outra de fechamento.</text>
</svg>
