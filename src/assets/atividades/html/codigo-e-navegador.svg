  <rect x="26" y="48" width="282" height="326" rx="8" fill="#0f172a"/>
  <text x="38" y="72" font-size="12" fill="#fca5a5" font-family="Consolas, Menlo, monospace" xml:space="preserve">&lt;h1&gt;Meu Time&lt;/h1&gt;</text>
  <text x="38" y="96" font-size="12" fill="#ffffff" font-family="Consolas, Menlo, monospace" xml:space="preserve">&lt;p&gt;O Fluminense joga</text>
  <text x="38" y="112" font-size="12" fill="#ffffff" font-family="Consolas, Menlo, monospace" xml:space="preserve">   no Maracanã.&lt;/p&gt;</text>
  <text x="38" y="136" font-size="12" fill="#fcd34d" font-family="Consolas, Menlo, monospace" xml:space="preserve">&lt;img src="time.png"</text>
  <text x="38" y="152" font-size="12" fill="#fcd34d" font-family="Consolas, Menlo, monospace" xml:space="preserve">     alt="Escudo"&gt;</text>
  <text x="38" y="176" font-size="12" fill="#fca5a5" font-family="Consolas, Menlo, monospace" xml:space="preserve">&lt;h2&gt;Títulos&lt;/h2&gt;</text>
  <text x="38" y="200" font-size="12" fill="#86efac" font-family="Consolas, Menlo, monospace" xml:space="preserve">&lt;ul&gt;</text>
  <text x="38" y="216" font-size="12" fill="#86efac" font-family="Consolas, Menlo, monospace" xml:space="preserve">  &lt;li&gt;Carioca&lt;/li&gt;</text>
  <text x="38" y="232" font-size="12" fill="#86efac" font-family="Consolas, Menlo, monospace" xml:space="preserve">  &lt;li&gt;Brasileiro&lt;/li&gt;</text>
  <text x="38" y="248" font-size="12" fill="#86efac" font-family="Consolas, Menlo, monospace" xml:space="preserve">&lt;/ul&gt;</text>
  <text x="38" y="272" font-size="11" fill="#93c5fd" font-family="Consolas, Menlo, monospace" xml:space="preserve">&lt;a href="https://ge.globo.com"&gt;</text>
  <text x="38" y="288" font-size="11" fill="#93c5fd" font-family="Consolas, Menlo, monospace" xml:space="preserve">  Notícias&lt;/a&gt;</text>
  <path d="M316 200 h26 l-8 -8 m8 8 l-8 8" fill="none" stroke="#6b7280" stroke-width="2.4"/>
  <rect x="350" y="48" width="264" height="326" rx="8" fill="#ffffff" stroke="#94a3b8"/>
  <rect x="350" y="48" width="264" height="26" rx="8" fill="#e2e8f0"/>
  <rect x="358" y="56" width="120" height="12" rx="6" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="374" y="66" font-size="8.5" fill="#6b7280">index.html</text>
  <text x="364" y="104" font-size="24" fill="#1f2937" font-weight="700">Meu Time</text>
  <text x="364" y="128" font-size="11.5" fill="#1f2937">O Fluminense joga no Maracanã.</text>
  <rect x="364" y="138" width="74" height="56" rx="4" fill="#ecfdf5" stroke="#86efac"/>
