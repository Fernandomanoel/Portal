  <text x="482" y="350" font-size="10.5" fill="#6b7280" text-anchor="middle">O HTML diz O QUE é cada coisa;</text>
  <text x="482" y="364" font-size="10.5" fill="#6b7280" text-anchor="middle">o navegador decide como mostrar.</text>
